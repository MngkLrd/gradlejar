name: Potion Timer Bar - Multi Version Build

on:
  push:
    branches: [main]
    paths:
      - 'projects/potiontimerbar-1.20.1/**'
      - 'projects/potiontimerbar-26.1/**'
      - 'projects/potiontimerbar-26.2/**'
      - 'projects/potiontimerbar-26.3/**'
      - '.github/workflows/potiontimerbar-ports.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.20.1'
            loader: forge
            java: '17'
            gradle: '8.14.5'
          - mc: '26.1'
            loader: neoforge
            java: '25'
            gradle: '9.2.1'
          - mc: '26.2'
            loader: neoforge
            java: '25'
            gradle: '9.2.1'
          - mc: '26.3'
            loader: neoforge
            java: '25'
            gradle: '9.2.1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Compile dedicated Minecraft target
        working-directory: projects/potiontimerbar-${{ matrix.mc }}
        run: gradle --no-daemon --stacktrace clean build
      - name: Check JAR contents
        working-directory: projects/potiontimerbar-${{ matrix.mc }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile
          p=json.loads(Path('build-profile.json').read_text())
          jar=Path('build/libs')/p['jar_glob']
          assert jar.exists() and jar.stat().st_size>4000,jar
          with zipfile.ZipFile(jar) as z:
              n=set(z.namelist())
              for f in ('dev/minemods/potiontimerbar/PotionTimerBar.class','dev/minemods/potiontimerbar/PotionHudOverlay.class','dev/minemods/potiontimerbar/EffectTracker.class','pack.mcmeta'):
                  assert f in n, f
              assert ('META-INF/mods.toml' if p['loader']=='forge' else 'META-INF/neoforge.mods.toml') in n
          print('Verified',jar,jar.stat().st_size,'bytes')
          PY
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="projects/potiontimerbar-${{ matrix.mc }}/build/libs/potiontimerbar-${{ matrix.mc }}-0.2.1.jar"
          tag="ci-potiontimerbar-mc${{ matrix.mc }}-${{ matrix.loader }}-0.2.1-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$jar" --target "$GITHUB_SHA" \
             --title "Potion Timer Bar 0.2.1 | MC ${{ matrix.mc }} ${{ matrix.loader }}" \
             --notes "Compiled on CI, JAR verified. Client-only HUD. In-game tests not yet performed." --prerelease
          echo "Download https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
