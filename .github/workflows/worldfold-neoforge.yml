name: World Fold NeoForge JAR
on:
  push:
    branches: [main]
    paths:
      - 'projects/worldfold-neoforge/**'
      - '.github/workflows/worldfold-neoforge.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile
        working-directory: projects/worldfold-neoforge
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify JAR
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('projects/worldfold-neoforge/build/libs/worldfold-neoforge-1.21.1-0.1.0.jar') as z:
              assert z.testzip() is None
              for entry in ['META-INF/neoforge.mods.toml','pack.mcmeta','dev/worldfold/WorldFold.class','dev/worldfold/item/FoldCompass.class','dev/worldfold/fold/PortalBridge.class','dev/worldfold/fold/Anchor.class','data/worldfold/recipe/fold_compass.json']:
                  assert entry in z.namelist(), entry
              assert not any(n.startswith('net/minecraft/') for n in z.namelist())
          PY
      - name: Publish JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ci-worldfold-neoforge-${GITHUB_RUN_NUMBER}" projects/worldfold-neoforge/build/libs/worldfold-neoforge-1.21.1-0.1.0.jar --target "$GITHUB_SHA" --title "World Fold 0.1.0 (NeoForge 1.21.1)" --notes "Compiled and archive-verified; requires Immersive Portals CE 6.1.3.x and Cloth Config. Runtime testing pending." --prerelease
