name: Bearback JAR Artifact
on:
  pull_request:
    paths:
      - 'projects/bearback/**'
      - '.github/workflows/bearback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bearback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build NeoForge JAR
        working-directory: projects/bearback
        run: gradle --no-daemon --stacktrace clean build
      - name: Upload Bearback JAR
        uses: actions/upload-artifact@v4
        with:
          name: bearback-1.21.1-0.1.0
          path: projects/bearback/build/libs/bearback-1.21.1-0.1.0.jar
          if-no-files-found: error
