name: Bearback JAR Artifact
on:
  pull_request:
    paths:
      - 'projects/bearback/**'
      - '.github/workflows/bearback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bearback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build NeoForge JAR
        working-directory: projects/bearback
        run: gradle --no-daemon --stacktrace clean build
      - name: Publish JAR to GitHub Releases
        if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ci/bearback-artifact')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tag="ci-bearback-mc1.21.1-0.1.0-${RUN_NUMBER}"
          gh release create "$tag" projects/bearback/build/libs/bearback-1.21.1-0.1.0.jar \
            --target "$TARGET_SHA" \
            --title "Bearback 0.1.0 | Minecraft 1.21.1 NeoForge" \
            --notes "Compiled on GitHub Actions. Client gameplay not yet tested." \
            --prerelease
