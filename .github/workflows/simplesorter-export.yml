name: Extract Simple Sorter Forge sources
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    if: github.head_ref == 'simplesorter-forge-1.20.1-smart2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
          persist-credentials: true
      - name: Expand original Forge sources into review branch
        run: |
          set -euo pipefail
          tar -xJf projects/simplesorter-neoforge-bundle.tar.xz -C projects
          git add -f projects/simplesorter-forge-1.20.1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Expose original Simple Sorter Forge sources for Smart 2.0 refactor"
            git push origin HEAD:${{ github.head_ref }}
          fi
