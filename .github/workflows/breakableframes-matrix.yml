name: Breakable End Portal Frames - 11 build targets
on:
  push:
    branches: [breakableframes-11-ports]
    paths:
      - 'tools/generate_breakable_frames.py'
      - '.github/workflows/breakableframes-matrix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mc: '1.20.1', loader: 'forge', java: '17', gradle: '8.14.5'}
          - {mc: '1.20.1', loader: 'neoforge', java: '17', gradle: '8.14.5'}
          - {mc: '1.20.1', loader: 'fabric', java: '21', gradle: '8.8'}
          - {mc: '1.21.1', loader: 'neoforge', java: '21', gradle: '9.2.1'}
          - {mc: '1.21.1', loader: 'fabric', java: '21', gradle: '8.14.5'}
          - {mc: '26.1.2', loader: 'neoforge', java: '25', gradle: '9.2.1'}
          - {mc: '26.1.2', loader: 'fabric', java: '25', gradle: '9.7.1'}
          - {mc: '26.2', loader: 'neoforge', java: '25', gradle: '9.2.1'}
          - {mc: '26.2', loader: 'fabric', java: '25', gradle: '9.7.1'}
          - {mc: '26.3', loader: 'neoforge', java: '25', gradle: '9.2.1'}
          - {mc: '26.3', loader: 'fabric', java: '25', gradle: '9.7.1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Generate dedicated projects
        run: python3 tools/generate_breakable_frames.py
      - name: Compile release JAR
        working-directory: projects/breakableframes-bundle/breakableframes-${{ matrix.mc }}-${{ matrix.loader }}
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify compiled JAR
        env:
          MC: ${{ matrix.mc }}
          LOADER: ${{ matrix.loader }}
        run: |
          python3 - <<'PY'
          import os,zipfile
          from pathlib import Path
          mc=os.environ['MC']; loader=os.environ['LOADER']
          p=Path(f'projects/breakableframes-bundle/breakableframes-{mc}-{loader}/build/libs/breakableframes-{mc}-{loader}-1.0.0.jar')
          assert p.is_file() and p.stat().st_size>1500,p
          with zipfile.ZipFile(p) as z:
              ns=set(z.namelist())
              for n in ('breakableframes.mixins.json','dev/minemods/breakableframes/mixin/FrameStateMixin.class'):
                  assert n in ns,n
              md=('fabric.mod.json' if loader=='fabric' else ('META-INF/mods.toml' if mc=='1.20.1' else 'META-INF/neoforge.mods.toml'))
              assert md in ns,md
              assert z.testzip() is None
          print('VERIFIED',p)
          PY
      - name: Publish JAR release
        env:
          GH_TOKEN: ${{ github.token }}
          MC: ${{ matrix.mc }}
          LOADER: ${{ matrix.loader }}
        run: |
          jar="projects/breakableframes-bundle/breakableframes-${MC}-${LOADER}/build/libs/breakableframes-${MC}-${LOADER}-1.0.0.jar"
          tag="ci-breakableframes-mc${MC}-${LOADER}-1.0.0-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$jar" --target "$GITHUB_SHA" --title "Breakable End Portal Frames 1.0.0 | ${MC} ${LOADER}" --notes "Compiled with Gradle. Static JAR checks passed. Not yet tested in-game." --prerelease
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
