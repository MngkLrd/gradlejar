name: Minecraft Mod Build Hub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      project_dir:
        description: 'Project path, @slug, @batch:slug1,slug2 (48 targets), or @changed:<base SHA>'
        required: true
        default: '.'
        type: string

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      project_dirs: ${{ steps.select.outputs.project_dirs }}
      qa_enabled: ${{ steps.select.outputs.qa_enabled }}
      art_blocked: ${{ steps.art-review.outputs.blocked }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: select
        env:
          PROJECT_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.project_dir || '' }}
        run: python3 tools/plan_builds.py "$PROJECT_DIR"

      - name: Validate changed texture review evidence
        id: art-review
        env:
          PROJECTS: ${{ steps.select.outputs.project_dirs }}
        run: python3 -m tools.qa.art_review_lock --projects "$PROJECTS"

  build:
    needs: plan
    if: needs.plan.outputs.project_dirs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        project_dir: ${{ fromJSON(needs.plan.outputs.project_dirs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enforce visual review before Gradle
        env:
          ART_BLOCKED: ${{ needs.plan.outputs.art_blocked }}
          PROJECT: ${{ matrix.project_dir }}
        run: |
          python3 -c 'import json,os,sys; sys.exit("Art review evidence missing or invalid; inspect plan job" if os.environ["PROJECT"] in json.loads(os.environ["ART_BLOCKED"]) else 0)'
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Restore Pocket Realms sources
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/unpack_pocketrealms.py
      - name: Restore Pocket Realms 0.3.9 update
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/unpack_pocketrealms_v039.py
      - name: Patch Pocket Realms 1.21.1 APIs
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/fix_pocketrealms_v039.py
      - name: Restore Pocket Realms 0.4.0 quality fixes
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/unpack_pocketrealms_v040.py
      - name: Apply Pocket Realms 0.4.1 combat and lighting balance
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/patch_pocketrealms_v041.py
      - name: Restore Pocket Realms 0.5.0 monster update
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/unpack_pocketrealms_v050.py
      - name: Fix Pocket Realms 0.5.0 NeoForge API details
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/fix_pocketrealms_v050.py
      - name: Restore Pocket Realms 0.5.1 custom sounds
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/unpack_pocketrealms_v051.py
      - name: Add distorted Pursuer sound effects
        if: matrix.project_dir == 'projects/pocketrealms'
        run: |
          python3 -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
          python3 tools/grime_pocketrealms_audio_v051.py
      - name: Polish Pocket Realms 0.5.1 visuals and portal
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/polish_pocketrealms_v051.py
      - name: Restore Pocket Realms 0.5.2 custom models
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/unpack_pocketrealms_v052.py
      - name: Apply Pocket Realms 0.5.3 living nightmare patch
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/apply_pocketrealms_v053.py
      - name: Restore Pocket Realms 0.6.0 chamber architecture
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/unpack_pocketrealms_v060.py
      - name: Align ceiling nests and room lighting with new height
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/fix_pocketrealms_v060_height.py
      - name: Restore Screenshot Manager sources
        if: matrix.project_dir == 'projects/screenshotmanager'
        run: python3 tools/unpack_screenshotmanager.py
      - name: Restore Pocket Realms 0.6.1 architectural blocks
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/unpack_pocketrealms_v061.py
      - name: Restore Screenshot Manager 26.x sources
        if: matrix.project_dir == 'projects/screenshotmanager262' || matrix.project_dir == 'projects/screenshotmanager263'
        run: |
          python3 tools/unpack_screenshotmanager.py
          python3 tools/port_screenshotmanager_26x.py "${{ matrix.project_dir }}"
      - name: Restore Pocket Realms 0.6.2 horror systems
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/upgrade_pocketrealms_v062.py
      - name: Integrate Pocket Realms 0.6.3 sanctuary and dread
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/upgrade_pocketrealms_v063.py
      - name: Integrate Pocket Realms 0.6.4 predatory haunting and equipment
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/upgrade_pocketrealms_v064.py
      - name: Integrate Pocket Realms 0.7.0 multistage and new predators
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/upgrade_pocketrealms_v070.py
      - name: Restore Simple Sorter 1.21.1 rework
        if: matrix.project_dir == 'projects/simplesorter-1.21.1'
        run: tar -xJf projects/simplesorter-1.21.1/source.tar.xz -C projects/simplesorter-1.21.1 --strip-components=1
      - name: Restore Lure Lantern 1.21.1 sources
        if: matrix.project_dir == 'projects/lurelantern-1.21.1'
        run: |
          tar -xJf projects/lurelantern-1.21.1/source.tar.xz -C projects/lurelantern-1.21.1
          sed -i 's/import net.minecraft.world.entity.animal.TamableAnimal;/import net.minecraft.world.entity.TamableAnimal;/' projects/lurelantern-1.21.1/src/main/java/com/kirill/lurelantern/blockentity/LureLanternBlockEntity.java
          sed -i 's/protected MapCodec<? extends LanternBlock> codec()/public MapCodec<? extends LanternBlock> codec()/' projects/lurelantern-1.21.1/src/main/java/com/kirill/lurelantern/block/LureLanternBlock.java
          sed -i 's/MapCodec<LureLanternBlock> CODEC = simpleCodec/MapCodec<LanternBlock> CODEC = simpleCodec/' projects/lurelantern-1.21.1/src/main/java/com/kirill/lurelantern/block/LureLanternBlock.java
          sed -i 's/public MapCodec<? extends LanternBlock> codec()/public MapCodec<LanternBlock> codec()/' projects/lurelantern-1.21.1/src/main/java/com/kirill/lurelantern/block/LureLanternBlock.java
          python3 projects/lurelantern-1.21.1/tools/rebuild_textures.py
      - name: Restore Big Frogs 1.21.1 sources
        if: matrix.project_dir == 'projects/bigfrogs'
        run: tar -xJf projects/bigfrogs/source.tar.xz -C projects/bigfrogs
      - name: Restore Simple Sorter NeoForge 26.x projects
        if: startsWith(matrix.project_dir, 'projects/simplesorter-neoforge-26.') || startsWith(matrix.project_dir, 'projects/simplesorter-fabric-') || (startsWith(matrix.project_dir, 'projects/simplesorter-forge-') && matrix.project_dir != 'projects/simplesorter-forge-1.20.1') || matrix.project_dir == 'projects/simplesorter-neoforge-1.20.1'
        run: tar -xJf projects/simplesorter-neoforge-bundle.tar.xz -C projects
      - name: Validate Keep Sign Text packaging
        if: startsWith(matrix.project_dir, 'projects/keepsigntext-')
        run: python3 tools/verify_keepsigntext.py "${{ matrix.project_dir }}"
      - name: Restore Last Witness sources
        if: matrix.project_dir == 'projects/last-witness'
        run: |
          cat projects/last-witness/source-b64/*.part | base64 -d | tar -xJf - -C projects/last-witness
      - name: Apply Last Witness 0.3.0 skins
        if: matrix.project_dir == 'projects/last-witness'
        run: |
          set -euo pipefail
          cat projects/last-witness/update-b64/*.part | base64 -d | tar -xJf - -C projects/last-witness
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 projects/last-witness/hotfix_031.py
          python3 projects/last-witness/tools/fetch_fixed_skins.py --minimum 15 --workers 6
      - name: Apply Last Witness 0.4.0 guard update
        if: matrix.project_dir == 'projects/last-witness'
        run: |
          set -euo pipefail
          cat projects/last-witness/guard-b64/*.part | base64 -d | tar -xJf - -C projects/last-witness
          python3 projects/last-witness/update_040.py
          python3 projects/last-witness/fix_040a.py
      - name: Apply Last Witness 0.4.1 village guard spawn fix
        if: matrix.project_dir == 'projects/last-witness'
        run: |
          set -euo pipefail
          python3 projects/last-witness/fix_041.py
      - name: Apply Last Witness 0.4.2 bow animation fix
        if: matrix.project_dir == 'projects/last-witness'
        run: |
          set -euo pipefail
          python3 -c "import pathlib,base64,zlib; p=pathlib.Path('projects/last-witness'); (p/'fix_042.py').write_bytes(zlib.decompress(base64.b64decode((p/'fix_042.b64z').read_text())))"
          python3 projects/last-witness/fix_042.py
          grep -q 'RangedBowAttackGoal<GuardEntity>' projects/last-witness/src/main/java/dev/minemods/lastwitness/guard/GuardEntity.java
          ! grep -q 'new ItemStack(Items.ARROW, 64)' projects/last-witness/src/main/java/dev/minemods/lastwitness/guard/GuardEntity.java
      - name: Apply Last Witness 0.4.3 witness eye
        if: matrix.project_dir == 'projects/last-witness'
        run: |
          set -euo pipefail
          python3 -c "import pathlib,base64,zlib; p=pathlib.Path('projects/last-witness'); (p/'patch_043.py').write_bytes(zlib.decompress(base64.b64decode((p/'patch_043.b64z').read_text())))"
          python3 projects/last-witness/patch_043.py
          sed -i 's/0\.4\.2/0.4.3/g' projects/last-witness/gradle.properties projects/last-witness/build-profile.json projects/last-witness/src/main/resources/META-INF/neoforge.mods.toml projects/last-witness/README.md
          test -f projects/last-witness/src/main/resources/assets/lastwitness/textures/gui/eye_watching.png
          test -f projects/last-witness/src/main/resources/assets/lastwitness/textures/gui/eye_alert.png
      - name: Apply Last Witness 0.5.0 AI, vision and trading
        if: matrix.project_dir == 'projects/last-witness'
        run: |
          set -euo pipefail
          cat projects/last-witness/patch-050.b64 | base64 -d | tar -xJf - -C projects/last-witness
          (cd projects/last-witness && awk '/^--- README.md$/ {skip=1; next} /^--- / {skip=0} !skip {print}' diff.patch > code-only.patch && patch --batch --forward -p0 -i code-only.patch && rm diff.patch code-only.patch)
          grep -q 'WITNESS_FOV' projects/last-witness/src/main/java/dev/minemods/lastwitness/config/WitnessConfig.java
          grep -q 'GuardBowTacticsGoal' projects/last-witness/src/main/java/dev/minemods/lastwitness/guard/GuardEntity.java
          grep -q 'refreshtrades' projects/last-witness/src/main/java/dev/minemods/lastwitness/guard/GuardCommands.java
      - name: Apply Last Witness 0.6.0 trading counter
        if: matrix.project_dir == 'projects/last-witness'
        run: |
          set -euo pipefail
          cat projects/last-witness/trade-b64/*.part | base64 -d | tar -xJf - -C projects/last-witness
          # v060 version alignment: the earlier v0.5.0 patch restores its own build profile.
          sed -i 's/0\.5\.0/0.6.0/g' projects/last-witness/gradle.properties projects/last-witness/build-profile.json
          test -f projects/last-witness/src/main/resources/assets/lastwitness/textures/gui/barter_counter.png
          test -f projects/last-witness/src/main/java/dev/minemods/lastwitness/barter/BarterMenu.java
          sed -i 's/this(id, inventory, null);/this(id, inventory, (Villager) null);/' projects/last-witness/src/main/java/dev/minemods/lastwitness/barter/BarterMenu.java
          grep -q 'TradeMenus.REGISTER.register' projects/last-witness/src/main/java/dev/minemods/lastwitness/LastWitnessMod.java
      - name: Generate standalone MIDNIGHT Reborn source project
        if: matrix.project_dir == 'projects/midnighteve'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "::group::Generate Java, models, textures and structure NBT"
          timeout --kill-after=5s 90s python3 -u projects/midnighteve/revise_evergreen_qa.py
          echo "::endgroup::"
          test -s projects/midnighteve/src/main/resources/data/midnighteve/structure/hollycroft_farm.nbt
          test -s projects/midnighteve/src/main/resources/data/midnighteve/structure/everlight_hamlet.nbt
          test -s projects/midnighteve/src/main/resources/data/midnighteve/structure/frostmarket.nbt
          test -s projects/midnighteve/src/main/resources/data/midnighteve/worldgen/structure/frostmarket.json
      - name: Restore unchanged MIDNIGHT music from verified 0.9.0
        if: matrix.project_dir == 'projects/midnighteve'
        timeout-minutes: 3
        run: |
          set -euo pipefail
          echo "Downloading the previously compiled original soundtrack; no system package installation required."
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 35 --retry 1 --retry-max-time 50 -o /tmp/midnight-audio-source.jar 'https://github.com/MngkLrd/gradlejar/releases/download/ci-midnighteve-mc1.21.1-neoforge-0.9.0-989-1/midnighteve-0.9.0.jar'
          echo 'c712a4f2422cdbbd7b2ec16824cc2656c8287166eaa9204e05c1d8e30084395c  /tmp/midnight-audio-source.jar' | sha256sum --check
          python3 -u - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path("projects/midnighteve/src/main/resources")
          with ZipFile("/tmp/midnight-audio-source.jar") as jar:
              for name in ("lanterns_at_dusk", "snow_over_the_fjords"):
                  asset = "assets/midnighteve/sounds/music/" + name + ".ogg"
                  data = jar.read(asset)
                  assert data.startswith(b"OggS") and len(data) > 1024, asset
                  path = root / asset
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
                  print("Restored verified music:", asset, len(data), flush=True)
          PY
          test -s projects/midnighteve/src/main/resources/assets/midnighteve/sounds/music/lanterns_at_dusk.ogg
      - name: Restore licensed Evergreen sound effects
        if: matrix.project_dir == 'projects/midnighteve'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          dest=projects/midnighteve/src/main/resources/assets/midnighteve/sounds/celebration
          mkdir -p "$dest"
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 --retry 1 -o "$dest/bell.ogg" 'https://raw.githubusercontent.com/Mcamento8/open-game-sfx-index/main/audio/impact-sounds/impactBell_heavy_001.ogg'
          echo "9df61e3ae9a83dc65e5a1fd3ed19d480876f3b22b963a1b9ef6fa293592dcec4  $dest/bell.ogg" | sha256sum --check
          test -s "$dest/bell.ogg"
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 --retry 1 -o "$dest/chime.ogg" 'https://raw.githubusercontent.com/Mcamento8/open-game-sfx-index/main/audio/music-jingles/jingles_PIZZI07.ogg'
          echo "91870588924e0e498c6eb8d4f4ccf8595c9e7dc51fb553797b551062e642ce7c  $dest/chime.ogg" | sha256sum --check
          test -s "$dest/chime.ogg"
      - name: Validate profile
        id: profile
        env:
          REQUESTED_DIR: ${{ matrix.project_dir }}
        run: python3 tools/resolve_project.py "$REQUESTED_DIR" >> "$GITHUB_OUTPUT"
      - name: Install project Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.profile.outputs.java }}
      - name: Install project Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.profile.outputs.gradle }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Bone Hunter Python synthesis dependencies
        if: matrix.project_dir == 'projects/spidercentaur'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bone Hunter synthesis libraries
        if: matrix.project_dir == 'projects/spidercentaur'
        run: python3 -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.14.1 soundfile==0.12.1
      - name: Install audio encoder for Spider Centaur
        if: matrix.project_dir == 'projects/spidercentaur'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Sleep Debt audio encoder
        if: matrix.project_dir == 'projects/sleepdebt'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Huss original voice synthesis and encoder
        if: matrix.project_dir == 'projects/husshusshuss-forge-1.21.1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg
      - name: Compile production mod
        env:
          PROJECT_DIR: ${{ steps.profile.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean build 2>&1 | tee "$GITHUB_WORKSPACE/build-output-${{ strategy.job-index }}.log"
      - name: Run Simple Sorter Smart 2.0 regression tests
        if: matrix.project_dir == 'projects/simplesorter-forge-1.20.1'
        run: |
          set -euo pipefail
          cd projects/simplesorter-forge-1.20.1
          mkdir -p build/smart2-tests
          javac -d build/smart2-tests \
            src/main/java/com/kirill/simplesorter/sorting/PathTokenMatcher.java \
            src/main/java/com/kirill/simplesorter/sorting/StrictStorageFamily.java \
            src/main/java/com/kirill/simplesorter/sorting/SemanticItemProfile.java \
            src/main/java/com/kirill/simplesorter/sorting/SemanticItemClassifier.java \
            src/main/java/com/kirill/simplesorter/sorting/StrictChestAdmission.java \
            src/main/java/com/kirill/simplesorter/sorting/RoutingPolicy.java \
            src/main/java/com/kirill/simplesorter/sorting/WarehouseLayout.java \
            src/main/java/com/kirill/simplesorter/sorting/WarehouseColumns.java \
            src/main/java/com/kirill/simplesorter/sorting/WarehouseFamilyPlan.java \
            src/main/java/com/kirill/simplesorter/sorting/WarehouseAssignmentPlanner.java \
            src/main/java/com/kirill/simplesorter/sorting/WarehouseSlotOptimizer.java \
            src/main/java/com/kirill/simplesorter/sorting/ChestInventoryShape.java \
            src/main/java/com/kirill/simplesorter/sorting/ScanGeometry.java \
            src/main/java/com/kirill/simplesorter/sorting/WarehouseConsolidationDecision.java \
            src/main/java/com/kirill/simplesorter/label/ChestCategoryLabels.java \
            src/main/java/com/kirill/simplesorter/sorting/WarehouseRoutingRules.java \
            src/main/java/com/kirill/simplesorter/client/FaceLabelDimensions.java \
            src/main/java/com/kirill/simplesorter/client/FixedLabelFaces.java \
            tools/tests/SmartRulesSelfTest.java \
            tools/tests/WarehouseLayoutSelfTest.java \
            tools/tests/WarehouseColumnsSelfTest.java \
            tools/tests/WarehouseRoutingRulesSelfTest.java \
            tools/tests/StrictStorageSelfTest.java \
            tools/tests/SemanticItemClassifierSelfTest.java \
            tools/tests/WarehouseFamilyPlanSelfTest.java \
            tools/tests/WarehouseAssignmentPlannerSelfTest.java \
            tools/tests/WarehouseSlotOptimizerSelfTest.java \
            tools/tests/ChestInventoryShapeSelfTest.java \
            tools/tests/ScanGeometrySelfTest.java \
            tools/tests/FaceLabelDimensionsSelfTest.java \
            tools/tests/FixedLabelFacesSelfTest.java
          java -ea -cp build/smart2-tests com.kirill.simplesorter.sorting.SmartRulesSelfTest
          java -ea -cp build/smart2-tests com.kirill.simplesorter.sorting.WarehouseLayoutSelfTest
          java -ea -cp build/smart2-tests com.kirill.simplesorter.sorting.WarehouseColumnsSelfTest
          java -ea -cp build/smart2-tests com.kirill.simplesorter.sorting.WarehouseRoutingRulesSelfTest
          java -ea -cp build/smart2-tests com.kirill.simplesorter.sorting.StrictStorageSelfTest
          java -ea -cp build/smart2-tests com.kirill.simplesorter.sorting.SemanticItemClassifierSelfTest
          java -ea -cp build/smart2-tests com.kirill.simplesorter.sorting.WarehouseFamilyPlanSelfTest
          java -ea -cp build/smart2-tests com.kirill.simplesorter.sorting.WarehouseAssignmentPlannerSelfTest
          java -ea -cp build/smart2-tests com.kirill.simplesorter.sorting.WarehouseSlotOptimizerSelfTest
          java -ea -cp build/smart2-tests com.kirill.simplesorter.sorting.ChestInventoryShapeSelfTest
          java -ea -cp build/smart2-tests com.kirill.simplesorter.sorting.ScanGeometrySelfTest
          java -ea -cp build/smart2-tests com.kirill.simplesorter.client.FaceLabelDimensionsSelfTest
          java -ea -cp build/smart2-tests com.kirill.simplesorter.client.FixedLabelFacesSelfTest
      - name: Check model, texture and datapack assets
        if: matrix.project_dir == 'projects/openmotion'
        run: python3 projects/openmotion/tools/check_assets.py
      - name: Verify Pocket Realms 0.7.0 stage and custom meshes
        if: matrix.project_dir == 'projects/pocketrealms'
        run: python3 tools/verify_pocketrealms_v070.py
      - name: Smoke-test Fragile Glass 26.x on real dedicated server
        if: startsWith(matrix.project_dir, 'projects/fragileglass-') && (endsWith(matrix.project_dir, '-26.1.2') || endsWith(matrix.project_dir, '-26.2') || endsWith(matrix.project_dir, '-26.3'))
        timeout-minutes: 6
        run: python3 -u tools/test_fragileglass_263.py "${{ matrix.project_dir }}"
      - name: Verify JAR
        id: verify
        env:
          PROJECT_DIR: ${{ steps.profile.outputs.project_dir }}
        run: python3 tools/verify_build_output.py "$PROJECT_DIR"
      - name: Verify Simple Sorter wand recipes in final JAR
        if: matrix.project_dir == 'projects/simplesorter-forge-1.20.1'
        run: |
          set -euo pipefail
          cd projects/simplesorter-forge-1.20.1
          jarfile=$(find build/libs -maxdepth 1 -name 'simplesorter-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n 1)
          test -n "$jarfile"
          for resource in \
            data/simplesorter/recipes/sorting_wand.json \
            data/simplesorter/recipes/sorting_wand_charcoal.json \
            data/simplesorter/advancements/recipes/misc/sorting_wand.json; do
            unzip -p "$jarfile" "$resource" | python3 -m json.tool >/dev/null
            echo "Verified: $resource"
          done
      - name: Smoke-test Simple Sorter dedicated server
        if: matrix.project_dir == 'projects/simplesorter-forge-1.20.1'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          cd projects/simplesorter-forge-1.20.1
          for dir in run runs/server; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            printf 'online-mode=false\nlevel-name=ci-sorter-test\nview-distance=3\nsimulation-distance=3\nmax-tick-time=-1\n' > "$dir/server.properties"
          done
          logfile="$GITHUB_WORKSPACE/simplesorter-forge-server.log"
          SIMPLE_SORTER_CI_STORAGE_TEST=1 timeout --signal=TERM --kill-after=15s 195s gradle --no-daemon runServer > "$logfile" 2>&1 &
          pid=$!
          passed=0
          for n in $(seq 1 190); do
            if grep -q 'Done (' "$logfile" && grep -q 'SORTER_CORE_LIVE_TEST_PASSED' "$logfile"; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$passed" -ne 1 ]; then
            echo 'Simple Sorter dedicated server did not reach startup completion.'
            tail -n 180 "$logfile"
            exit 1
          fi
          if ! grep -q 'Sorting Wand crafting recipes registered: coal=true, charcoal=true' "$logfile"; then
            echo 'Sorting Wand recipes did not register in the Forge RecipeManager.'
            grep -E 'SimpleSorter/Recipes|Sorting Wand crafting' "$logfile" || true
            exit 1
          fi
          echo 'Simple Sorter dedicated server boot and active recipe registry verified.'
      - name: Smoke-test MIDNIGHT dedicated server, architecture, merchants and biomes
        if: matrix.project_dir == 'projects/midnighteve'
        env:
          PROJECT_DIR: ${{ steps.profile.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          for dir in run runs/server; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            printf 'level-name=ci-world\nlevel-type=midnighteve:endless_eve\nlevel-seed=824681\nonline-mode=false\nserver-ip=127.0.0.1\nview-distance=4\nsimulation-distance=4\nspawn-protection=0\nmax-tick-time=-1\nenable-rcon=true\nrcon.port=25575\nrcon.password=midnight-ci-local-050\n' > "$dir/server.properties"
          done
          timeout --signal=TERM --kill-after=20s 270s gradle --no-daemon runServer --stacktrace > midnight-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; tail -n 100 midnight-server.log' EXIT
          for n in $(seq 1 180); do
            if grep -q 'Done (' midnight-server.log; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          grep -q 'Done (' midnight-server.log
          python3 test_reborn_server.py
          wait "$pid"
          python3 "$GITHUB_WORKSPACE/tools/test_midnight_worldgen.py" run runs/server
          python3 test_frostlands.py run runs/server
          trap - EXIT
      - name: Smoke-test World Logic production JAR
        if: matrix.project_dir == 'projects/worldlogic-1.21.1-forge'
        timeout-minutes: 9
        env:
          PROJECT_DIR: ${{ steps.profile.outputs.project_dir }}
        run: python3 "$PROJECT_DIR/tools/smoke_server.py" "$PROJECT_DIR"
      - name: Validate WallSlam collision resources
        if: startsWith(matrix.project_dir, 'projects/wallslam-')
        env:
          PROJECT_DIR: ${{ steps.profile.outputs.project_dir }}
        run: python3 tools/verify_wallslam_release.py "$PROJECT_DIR"
      - name: Resolve v2 quality policy
        id: qa-policy
        env:
          PROJECT_DIR: ${{ matrix.project_dir }}
        run: python3 -m tools.qa.prepare "$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      - name: Install exact runtime Java for production test
        if: steps.qa-policy.outputs.mode == 'server' && steps.qa-policy.outputs.runtime_java != steps.profile.outputs.java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.qa-policy.outputs.runtime_java }}
      - uses: actions/setup-node@v4
        if: steps.qa-policy.outputs.player == 'true'
        with:
          node-version: '22'
      - name: Install protocol QA player
        if: steps.qa-policy.outputs.player == 'true'
        working-directory: tools/qa/bot
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Discover packaged recipes and generate candidate tests
        if: steps.verify.outcome == 'success' && (steps.qa-policy.outputs.mode == 'server' || steps.qa-policy.outputs.mode == 'client')
        continue-on-error: true
        env:
          JAR_PATH: ${{ steps.verify.outputs.jar_path }}
          MC_VERSION: ${{ steps.profile.outputs.minecraft }}
          MOD_LOADER: ${{ steps.profile.outputs.loader }}
          RECIPE_OUT: recipe-qa-${{ strategy.job-index }}
        run: python3 -m tools.qa.recipe_qa "$JAR_PATH" --minecraft "$MC_VERSION" --loader "$MOD_LOADER" --out "$RECIPE_OUT"
      - name: Upload recipe inventory and generated candidate scenarios
        if: always() && steps.verify.outcome == 'success' && (steps.qa-policy.outputs.mode == 'server' || steps.qa-policy.outputs.mode == 'client')
        uses: actions/upload-artifact@v4
        with:
          name: recipe-qa-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: recipe-qa-${{ strategy.job-index }}/
          if-no-files-found: warn
          retention-days: 14
      - name: QA v2 production JAR release gate
        id: qa
        timeout-minutes: 18
        env:
          PROJECT_DIR: ${{ matrix.project_dir }}
          JAR_PATH: ${{ steps.verify.outputs.jar_path }}
          REPORT: qa-report-${{ strategy.job-index }}.json
          QA_WORK: qa-work-${{ strategy.job-index }}
        run: python3 -m tools.qa.gate "$PROJECT_DIR" --jar "$JAR_PATH" --report "$REPORT" --work "$QA_WORK"
      - name: Record failure or skipped quality gate
        if: always()
        env:
          PROJECT_DIR: ${{ matrix.project_dir }}
          REPORT: qa-report-${{ strategy.job-index }}.json
          QA_WORK: qa-work-${{ strategy.job-index }}
          BUILD_LOG: build-output-${{ strategy.job-index }}.log
        run: |
          if [ ! -s "$REPORT" ]; then
            python3 -m tools.qa.gate "$PROJECT_DIR" --report "$REPORT" --work "$QA_WORK" --failure-log "$BUILD_LOG" || true
          fi
      - name: Upload machine-readable QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: qa-report-${{ strategy.job-index }}.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload diagnostic logs for failed QA
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diagnostics-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            qa-work-${{ strategy.job-index }}/logs/
            build-output-${{ strategy.job-index }}.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload unapproved candidate for manual debugging only
        if: always() && steps.verify.outcome == 'success' && steps.qa.outputs.eligible != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-candidate-NOT-RELEASE-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ steps.verify.outputs.jar_path }}
          if-no-files-found: warn
          retention-days: 7
      - name: Upload compiled JAR as workflow artifact (release fallback)
        if: success() && steps.verify.outcome == 'success' && steps.qa.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ steps.profile.outputs.slug }}-${{ steps.profile.outputs.minecraft }}-${{ steps.profile.outputs.loader }}-${{ steps.profile.outputs.version }}-${{ strategy.job-index }}
          overwrite: true
          path: |
            ${{ steps.verify.outputs.jar_path }}
            ${{ steps.verify.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish JAR to GitHub prerelease
        if: success() && github.event_name != 'pull_request' && steps.qa.outputs.eligible == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JAR_PATH: ${{ steps.verify.outputs.jar_path }}
          CHECKSUM_PATH: ${{ steps.verify.outputs.checksum_path }}
          MOD_SLUG: ${{ steps.profile.outputs.slug }}
          MOD_VERSION: ${{ steps.profile.outputs.version }}
          MOD_LOADER: ${{ steps.profile.outputs.loader }}
          MC_VERSION: ${{ steps.profile.outputs.minecraft }}
          QA_LEVEL: ${{ steps.qa.outputs.level }}
        run: |
          set -euo pipefail
          tag="ci-${MOD_SLUG}-mc${MC_VERSION}-${MOD_LOADER}-${MOD_VERSION}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$JAR_PATH" "$CHECKSUM_PATH" \
            --target "$GITHUB_SHA" \
            --title "${MOD_SLUG} ${MOD_VERSION} (Minecraft ${MC_VERSION}, ${MOD_LOADER}) — CI ${GITHUB_RUN_NUMBER}" \
            --notes "Quality level QA-${QA_LEVEL}. QA-2 is legacy/static only; QA-4 is production-server gameplay verified. Manual client gameplay untested." \
            --prerelease
          echo "### Download compiled JAR" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build failure summary
        if: failure()
        run: |
          echo "See the first failed Gradle task above; full logs are in the build step." >> "$GITHUB_STEP_SUMMARY"

  package-qa-v2:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.qa_enabled == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve QA evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: qa-report-*-${{ github.run_attempt }}
          path: qa-input/reports
      - name: Retrieve eligible release JARs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: jar-*
          path: qa-input/jars
      - name: Build complete, checksum-matched release cohorts
        env:
          PLANNED_PROJECTS: ${{ needs.plan.outputs.project_dirs }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: python3 -m tools.qa.bundle qa-input/reports qa-input/jars qa-bundles
      - name: Generate one bulk upload plan for verified cohorts
        run: python3 -m tools.qa.bulk_upload qa-bundles qa-input/reports --out qa-bundles
      - name: Upload bundles and separate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-v2-bundles-${{ github.run_attempt }}
          path: qa-bundles/
          if-no-files-found: error
          retention-days: 30
      - name: Publish only complete verified cohorts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for zip in qa-bundles/*.zip; do
            tag="qa-v2-$(basename "$zip" .zip)-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            if gh release create "$tag" "$zip" --target "$GITHUB_SHA" --title "$(basename "$zip" .zip)" --notes "Every declared target passed production-JAR server gameplay QA-4. Manual client verification not included. See workflow evidence." --prerelease; then
              echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::GitHub release publication failed; verified ZIP remains available in qa-v2-bundles artifact."
              echo "Verified ZIP retained as workflow artifact; GitHub Releases publication failed." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
