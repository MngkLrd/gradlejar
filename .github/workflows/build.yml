name: FieldKit NeoForge JAR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install official Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compile production JAR with NeoForge
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean build 2>&1 | tee build-output.log
      - name: Verify JAR archive and JVM references
        run: python3 tools/verify_release.py build/libs/fieldkit-1.2.2.jar
      - name: Publish compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: FieldKit-1.2.2-NeoForge-JAR
          path: build/libs/fieldkit-1.2.2.jar
          if-no-files-found: error
      - name: Publish build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FieldKit-build-failure-log
          path: build-output.log
          if-no-files-found: ignore
