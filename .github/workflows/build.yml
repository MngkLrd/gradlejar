name: Minecraft Mod Build Hub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      project_dir:
        description: 'Project location: . or projects/modname'
        required: true
        default: '.'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Validate mod build profile
        id: profile
        shell: bash
        env:
          REQUESTED_DIR: ${{ inputs.project_dir || '.' }}
        run: |
          set -euo pipefail
          python3 tools/resolve_project.py "$REQUESTED_DIR" >> "$GITHUB_OUTPUT"

      - name: Install project Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.profile.outputs.java }}

      - name: Install project Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.profile.outputs.gradle }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Compile JAR with real mod loader dependencies
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.profile.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean build 2>&1 | tee "$GITHUB_WORKSPACE/build-output.log"

      - name: Verify resulting JAR
        id: verify
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.profile.outputs.project_dir }}
        run: |
          set -euo pipefail
          python3 tools/verify_build_output.py "$PROJECT_DIR"

      - name: Publish tested build output to GitHub Releases
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JAR_PATH: ${{ steps.verify.outputs.jar_path }}
          CHECKSUM_PATH: ${{ steps.verify.outputs.checksum_path }}
          MOD_SLUG: ${{ steps.profile.outputs.slug }}
          MOD_VERSION: ${{ steps.profile.outputs.version }}
          MOD_LOADER: ${{ steps.profile.outputs.loader }}
          MC_VERSION: ${{ steps.profile.outputs.minecraft }}
        run: |
          set -euo pipefail
          tag="ci-${MOD_SLUG}-${MOD_VERSION}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$JAR_PATH" "$CHECKSUM_PATH" \
            --target "$GITHUB_SHA" \
            --title "${MOD_SLUG} ${MOD_VERSION} (Minecraft ${MC_VERSION}, ${MOD_LOADER}) — CI ${GITHUB_RUN_NUMBER}" \
            --notes "Compiled by Minecraft Mod Build Hub using official dependencies. Static JAR checks passed. In-game testing has NOT been performed." \
            --prerelease
          echo "### Compiled mod JAR" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show first relevant build errors
        if: failure()
        run: |
          if [ -f build-output.log ]; then
            echo "### Last 80 Gradle log lines" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 build-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
