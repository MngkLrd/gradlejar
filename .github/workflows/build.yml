name: FieldKit NeoForge JAR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install official Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compile production JAR with NeoForge
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean build 2>&1 | tee build-output.log
      - name: Verify JAR archive and JVM references
        run: python3 tools/verify_release.py build/libs/fieldkit-1.2.2.jar
      - name: Create release checksum
        run: sha256sum build/libs/fieldkit-1.2.2.jar > build/libs/fieldkit-1.2.2.jar.sha256
      # The account hit the Actions artifact-storage quota; GitHub Releases does not use Actions artifacts.
      - name: Publish compiled JAR as GitHub prerelease
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="fieldkit-1.2.2-ci-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            build/libs/fieldkit-1.2.2.jar \
            build/libs/fieldkit-1.2.2.jar.sha256 \
            --target "$GITHUB_SHA" \
            --title "FieldKit 1.2.2 - CI build ${GITHUB_RUN_NUMBER}" \
            --notes "Compiled using Java 21 and NeoForge 21.1.262 via ModDevGradle. Static JAR validator passed. In-game client testing is still required." \
            --prerelease
          echo "### Download compiled JAR" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          echo "Build failed. Open the Compile / Verify / Release step logs in this run." >> "$GITHUB_STEP_SUMMARY"
          if [ -f build-output.log ]; then tail -n 70 build-output.log >> "$GITHUB_STEP_SUMMARY"; fi
