name: WorldLogic active-peer exact-binary diagnostic (NOT RELEASE)
on:
  push:
    branches: [worldlogic-core6-active-pack-diagnostic]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run existing production-server QA with exact six current peer binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.qa.active_peer_diagnostic
      - name: Upload diagnostic evidence (never release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldlogic-current-six-peers-NOT-RELEASE
          path: |
            active-peer-report.json
            active-peer-runtime/logs/
          if-no-files-found: warn
          retention-days: 7
