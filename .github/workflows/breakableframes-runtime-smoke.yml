name: Breakable End Portal Frames runtime smoke
on:
  push:
    branches: [breakableframes-11-ports]
    paths: ['.github/workflows/breakableframes-runtime-smoke.yml','tools/generate_breakable_frames.py']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mc: '1.20.1', loader: forge, java: '17', gradle: '8.14.5'}
          - {mc: '1.21.1', loader: neoforge, java: '21', gradle: '9.2.1'}
          - {mc: '1.21.1', loader: fabric, java: '21', gradle: '8.14.5'}
          - {mc: '26.3', loader: neoforge, java: '25', gradle: '9.2.1'}
          - {mc: '26.3', loader: fabric, java: '25', gradle: '9.7.1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '${{ matrix.java }}'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '${{ matrix.gradle }}'}
      - name: Generate project
        run: python3 tools/generate_breakable_frames.py
      - name: Launch dedicated Minecraft runtime and scan for Mixin crashes
        working-directory: projects/breakableframes-bundle/breakableframes-${{ matrix.mc }}-${{ matrix.loader }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p run/server runs/server server run
          echo 'eula=true' > run/eula.txt
          echo 'eula=true' > run/server/eula.txt
          echo 'eula=true' > runs/server/eula.txt
          echo 'eula=true' > server/eula.txt
          echo 'online-mode=false' > run/server.properties
          echo 'online-mode=false' > runs/server/server.properties
          timeout --signal=SIGINT 230s gradle --no-daemon runServer > /tmp/server-stdout.log 2>&1
          status=$?
          tail -n 180 /tmp/server-stdout.log || true
          echo "Gradle runServer exit status: $status"
          find . -type f \( -name 'latest.log' -o -name '*-crash.txt' \) -print -exec tail -n 120 {} \; || true
          if grep -Eiq '(MixinApplyError|InvalidMixinException|InjectionError|Critical injection failure|MixinTransformerError|NoClassDefFoundError|NoSuchMethodError|ExceptionInInitializerError|Failed to start)' /tmp/server-stdout.log; then
            echo "::error::Minecraft runtime reported a possible crash"
            exit 1
          fi
          if ! grep -Eiq '(Done \(|You need to agree to the EULA|Preparing level|Starting minecraft server|Starting Minecraft server)' /tmp/server-stdout.log; then
            echo "::error::No evidence Minecraft server started successfully"
            exit 1
          fi
          echo 'RUNTIME SMOKE PASS'
