name: Quick Stack Nearby NeoForge JAR

on:
  push:
    branches: [main]
    paths:
      - 'projects/quickstacknearby-neoforge/**'
      - '.github/workflows/quickstacknearby-neoforge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile NeoForge 1.21.1
        working-directory: projects/quickstacknearby-neoforge
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify compiled mod
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jar = Path('projects/quickstacknearby-neoforge/build/libs/quickstacknearby-neoforge-1.21.1-1.0.0.jar')
          assert jar.is_file(), f'Missing JAR: {jar}'
          with ZipFile(jar) as z:
              names = set(z.namelist())
              expected = {
                  'META-INF/neoforge.mods.toml',
                  'dev/quickstacknearby/QuickStackNearby.class',
                  'dev/quickstacknearby/server/QuickStackService.class',
                  'dev/quickstacknearby/network/QuickStackNetwork.class',
                  'dev/quickstacknearby/client/QuickStackKeys.class',
              }
              assert not expected.difference(names), f'Missing: {expected.difference(names)}'
          print('Verified compiled NeoForge JAR:', jar)
          PY
      - name: Publish compiled JAR to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ci-quickstacknearby-neoforge-1.21.1-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" projects/quickstacknearby-neoforge/build/libs/quickstacknearby-neoforge-1.21.1-1.0.0.jar \
            --target "$GITHUB_SHA" \
            --title "Quick Stack Nearby 1.0.0 (NeoForge 1.21.1)" \
            --notes "Compiled and checked by GitHub Actions. In-game client and server tests pending." \
            --prerelease
