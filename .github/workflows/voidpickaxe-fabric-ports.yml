name: Void Pickaxe Fabric Ports
on:
  push:
    branches: [main]
    paths:
      - 'projects/voidpickaxe-fabric-*/**'
      - '.github/workflows/voidpickaxe-fabric-ports.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mc: '1.20.1', java: '21'}
          - {mc: '1.21.1', java: '21'}
          - {mc: '26.2', java: '25'}
          - {mc: '26.3', java: '25'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '${{ matrix.java }}'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.2.1'}
      - name: Compile and remap
        working-directory: projects/voidpickaxe-fabric-${{ matrix.mc }}
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify JAR
        env: {MC: '${{ matrix.mc }}'}
        run: |
          python3 - <<'PY'
          import os,struct,json,zipfile
          from pathlib import Path
          mc=os.environ['MC']
          p=Path(f'projects/voidpickaxe-fabric-{mc}/build/libs/voidpickaxe-fabric-mc{mc}-1.1.3.jar')
          assert p.exists(),p
          with zipfile.ZipFile(p) as z:
              ns=set(z.namelist())
              for name in ['fabric.mod.json','voidpickaxe.mixins.json','assets/voidchisel/models/item/void_chisel.json','assets/voidchisel/textures/item/void_chisel.png']:
                  assert name in ns,name
              path=f'data/voidchisel/{"recipes" if mc=="1.20.1" else "recipe"}/void_chisel.json'
              r=json.loads(z.read(path))
              assert r['pattern']==[' W ','NSN',' S ']
              assert r['key']['S']==('minecraft:stick' if mc.startswith('26.') else {'item':'minecraft:stick'})
              assert r['result']['item' if mc=='1.20.1' else 'id']=='voidchisel:void_chisel'
              assert struct.unpack('>II',z.read('assets/voidchisel/textures/item/void_chisel.png')[16:24])==(32,32)
              assert z.testzip() is None
          print('PASS',p)
          PY
      - name: Publish JAR
        env: {GH_TOKEN: '${{ github.token }}', MC: '${{ matrix.mc }}'}
        run: |
          file="projects/voidpickaxe-fabric-${MC}/build/libs/voidpickaxe-fabric-mc${MC}-1.1.3.jar"
          tag="ci-voidpickaxe-fabric-mc${MC}-1.1.3-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$file" --target "$GITHUB_SHA" --title "Void Pickaxe 1.1.3 Fabric ${MC}" --notes "CI-compiled and recipe/texture verified, gameplay runtime untested." --prerelease
