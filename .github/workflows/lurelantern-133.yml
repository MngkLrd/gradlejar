name: Lure Lantern 1.3.3 NeoForge JAR
on:
  push:
    branches: [lurelantern-133-fix]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/lurelantern-1.3.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build NeoForge and verify original binary
        run: gradle --no-daemon clean build --stacktrace
      - name: Check JAR and original features
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          jar=pathlib.Path('build/libs/lurelantern-1.3.3.jar')
          assert jar.is_file()
          with zipfile.ZipFile(jar) as z:
              bad=z.testzip()
              assert bad is None, bad
              names=set(z.namelist())
              for path in [
                  'com/kirill/lurelantern/block/LureLanternBlock.class',
                  'com/kirill/lurelantern/item/LureLanternBlockItem.class',
                  'com/kirill/lurelantern/blockentity/LureLanternBlockEntity.class',
                  'com/kirill/lurelantern/util/CapturedMobData.class',
                  'com/kirill/lurelantern/util/LureLanternLogic.class',
                  'com/kirill/lurelantern/client/CapturedMobRenderer.class',
                  'com/kirill/lurelantern/client/ClientRenderRegistration.class',
                  'com/kirill/lurelantern/logic/SafeLanternDrops.class',
                  'assets/lurelantern/textures/block/advanced_lure_lantern.png',
                  'data/lurelantern/recipe/advanced_lure_lantern.json',
                  'data/lurelantern/loot_table/blocks/advanced_lure_lantern.json',
                  'META-INF/neoforge.mods.toml',
              ]:
                  assert path in names,path
              assert b'version="1.3.3"' in z.read('META-INF/neoforge.mods.toml')
          print('JAR static check OK; byte size:',jar.stat().st_size)
          PY
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="lurelantern-1.3.3-${GITHUB_SHA:0:9}"
          gh release create "$tag" build/libs/lurelantern-1.3.3.jar --prerelease --title "Lure Lantern 1.3.3 (NeoForge 1.21.1)" --notes "Drop preservation and rotating captured-mob preview. Source: ${GITHUB_SHA}. Compile verified. In-game verification required."
