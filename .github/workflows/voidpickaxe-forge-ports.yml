name: Void Pickaxe Forge and NeoForge Ports
on:
  push:
    branches: [main]
    paths:
      - 'projects/voidpickaxe-forge-*/**'
      - 'projects/voidpickaxe-neoforge-*/**'
      - '.github/workflows/voidpickaxe-forge-ports.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.20.1', loader: forge, java: '17' }
          - { mc: '1.20.1', loader: neoforge, java: '17' }
          - { mc: '26.2', loader: forge, java: '25' }
          - { mc: '26.3', loader: forge, java: '25' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '${{ matrix.java }}'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.2.1'}
      - name: Compile and reobfuscate
        working-directory: projects/voidpickaxe-${{ matrix.loader }}-${{ matrix.mc }}
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify JAR
        env: {MC: '${{ matrix.mc }}', LOADER: '${{ matrix.loader }}'}
        run: |
          python3 - <<'PY'
          import os,struct,json,zipfile
          from pathlib import Path
          mc=os.environ['MC'];loader=os.environ['LOADER']
          jar=Path(f'projects/voidpickaxe-{loader}-{mc}/build/libs/voidpickaxe-{loader}-mc{mc}-1.1.3.jar')
          assert jar.exists(),jar
          with zipfile.ZipFile(jar) as z:
              ns=set(z.namelist())
              for s in ['META-INF/mods.toml','voidpickaxe.mixins.json',
                        'assets/voidchisel/models/item/void_chisel.json',
                        'assets/voidchisel/textures/item/void_chisel.png']:
                  assert s in ns,s
              r=json.loads(z.read(f'data/voidchisel/{"recipes" if mc=="1.20.1" else "recipe"}/void_chisel.json'))
              assert r['pattern']==[' W ','NSN',' S ']
              assert r['key']['S']==({'item':'minecraft:stick'} if mc=='1.20.1' else 'minecraft:stick')
              assert struct.unpack('>II',z.read('assets/voidchisel/textures/item/void_chisel.png')[16:24])==(32,32)
              assert z.testzip() is None
          print('PASS',jar)
          PY
      - name: Publish JAR
        env: {GH_TOKEN: '${{ github.token }}', MC: '${{ matrix.mc }}', LOADER: '${{ matrix.loader }}'}
        run: |
          file="projects/voidpickaxe-${LOADER}-${MC}/build/libs/voidpickaxe-${LOADER}-mc${MC}-1.1.3.jar"
          tag="ci-voidpickaxe-${LOADER}-mc${MC}-1.1.3-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$file" --target "$GITHUB_SHA" --title "Void Pickaxe 1.1.3 ${LOADER} ${MC}" --notes "CI-compiled and recipe/texture verified, gameplay runtime untested." --prerelease
