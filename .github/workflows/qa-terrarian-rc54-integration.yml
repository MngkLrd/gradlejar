name: Terrarian Core 1.5.1 exact-artifact integration diagnostic
on:
  pull_request:
    paths:
      - 'projects/worldlogic-terrain-1.21.1-neoforge/**'
      - 'tools/qa/scenarios/worldlogicterrain.json'
      - '.github/workflows/qa-terrarian-rc54-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rc54-diagnostic:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'draft/terrarian-core-rc53-physics'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CORE_HASH: a966fb939988e794586cd6a1ea18fafe340296447b67ef8a9827963328e20548
      CORE_NAME: worldlogic-neoforge-mc1.21.1-1.5.1.jar
      PROJECT: projects/worldlogic-terrain-1.21.1-neoforge
      MINEMODS_DEP_CACHE: ${{ github.workspace }}/.terrarian-diagnostic-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Fetch and verify exact Core candidate and QA provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46123087105" --jq '.head_sha + " " + .conclusion' | grep -Fx '4a3e510fd4dcfae50e4292b2b2f95eca2f26a0e4 success'
          mkdir -p core-candidate core-report "$MINEMODS_DEP_CACHE"
          gh run download 46123087105 --repo "$GITHUB_REPOSITORY" --name jar-worldlogic-1.21.1-neoforge-1.5.1-0 --dir core-candidate
          gh run download 46123087105 --repo "$GITHUB_REPOSITORY" --name qa-report-0-1 --dir core-report
          python3 -c 'import json,os; r=json.load(open("core-report/qa-report-0.json")); assert r["jar"]==os.environ["CORE_NAME"] and r["sha256"]==os.environ["CORE_HASH"] and r["eligible"] is True'
          echo "$CORE_HASH  core-candidate/$CORE_NAME" | sha256sum -c -
          cp "core-candidate/$CORE_NAME" "$MINEMODS_DEP_CACHE/$CORE_HASH"
      - name: Compile Terrarian against exact Core candidate
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --no-daemon --stacktrace clean build 2>&1 | tee "$GITHUB_WORKSPACE/terrarian-build.log"
      - name: Execute existing production server QA without release authorization
        run: |
          set -euo pipefail
          python3 -m tools.qa.gate "$PROJECT" --jar "$PROJECT/build/libs/worldlogicterrain-neoforge-mc1.21.1-1.8.0.jar" --report terrarian-diagnostic-report.json --work terrarian-diagnostic-work
      - name: Verify optional Metabolism 0.9.0 peer and run combined server diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46113533767" --jq '.head_sha + " " + .conclusion' | grep -Fx '6f1806448dc661e2533d60f3f748456d4e008b13 success'
          mkdir -p metabolism-candidate metabolism-report
          gh run download 46113533767 --repo "$GITHUB_REPOSITORY" --name jar-metabolism-1.21.1-neoforge-0.9.0-0 --dir metabolism-candidate
          gh run download 46113533767 --repo "$GITHUB_REPOSITORY" --name qa-report-0-1 --dir metabolism-report
          python3 - <<'PY'
          import hashlib,json,pathlib
          from tools.qa import server
          jar=next(pathlib.Path("metabolism-candidate").rglob("metabolism-neoforge-mc1.21.1-0.9.0.jar"))
          report_path=next(pathlib.Path("metabolism-report").rglob("qa-report-0.json"))
          meta=json.loads(report_path.read_text())
          assert meta["eligible"] and meta["jar"]==jar.name and meta["sha256"]==hashlib.sha256(jar.read_bytes()).hexdigest()
          project=pathlib.Path("projects/worldlogic-terrain-1.21.1-neoforge")
          p=json.loads((project/"build-profile.json").read_text())
          report={"kind":"terrarian-metabolism-diagnostic","eligible":False,"checks":[]}
          try:
              server.run(p,p["qa"],project/"build/libs"/p["jar_glob"],"terrarian-metabolism-work",report,extra_jars=[jar],scenarios=[("food_ownership","tools/qa/scenarios/worldlogicterrain-metabolism.json")])
          finally:
              pathlib.Path("terrarian-metabolism-report.json").write_text(json.dumps(report,indent=2))
          PY
      - name: Upload diagnostic JAR only, never a release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrarian-1.8.0-core-1.5.1-NOT-RELEASE
          path: projects/worldlogic-terrain-1.21.1-neoforge/build/libs/worldlogicterrain-neoforge-mc1.21.1-1.8.0.jar
          if-no-files-found: warn
          retention-days: 7
      - name: Upload diagnostic QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrarian-1.8.0-diagnostic-evidence
          path: |
            core-report/qa-report-0.json
            terrarian-diagnostic-report.json
            terrarian-build.log
            terrarian-diagnostic-work/logs/
            terrarian-metabolism-report.json
            terrarian-metabolism-work/logs/
          if-no-files-found: warn
          retention-days: 7
