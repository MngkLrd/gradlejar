name: WorldLogic Terrain natural generation QA
on:
  pull_request:
    paths:
      - 'projects/worldlogic-terrain-1.21.1-neoforge/**'
      - 'tools/qa/scenarios/worldlogicterrain.json'
      - '.github/workflows/qa-worldlogicterrain-worldgen.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  natural-world:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact successful Build Hub artifact for this commit
        id: terrain-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p natural-inputs
          run_id=""
          for i in $(seq 1 36); do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$HEAD_SHA&per_page=10" --jq '.workflow_runs | map(select(.event == "pull_request" or .event == "workflow_dispatch" or .event == "push")) | first | .id // empty')
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ]
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'jar-worldlogicterrain-1.21.1-neoforge-*' --dir natural-inputs
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'qa-report-*' --dir natural-inputs
      - name: Test actual generated chunks in Earthlike Climate
        run: |
          python -m pip install nbtlib==2.0.4
          PYTHONPATH=. python projects/worldlogic-terrain-1.21.1-neoforge/qa/worldgen_smoke.py natural-inputs natural-world-qa
      - name: Fetch verified RC26 core artifact and run unified ecology regression
        if: always() && steps.terrain-artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45989182596" --jq '.head_sha + " " + .conclusion' | grep -Fx 'c244e710efd67c6b17066f5de812776fb752bd5e success'
          gh run download 45989182596 --repo "$GITHUB_REPOSITORY" --pattern 'jar-worldlogic-1.21.1-neoforge-1.0.0-rc26-*' --dir core-rc26-inputs
          gh run download 45989182596 --repo "$GITHUB_REPOSITORY" --pattern 'qa-report-*' --dir core-rc26-inputs
          python -m pip install nbtlib==2.0.4
          PYTHONPATH=. python projects/worldlogic-terrain-1.21.1-neoforge/qa/worldgen_smoke.py natural-inputs unified-world-qa core-rc26-inputs
      - name: Fetch verified RC30 core and run native aquatic regression
        if: always() && steps.terrain-artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45998551314" --jq '.head_sha + " " + .conclusion' | grep -Fx '5c27385d14c69f9716ffe09df10cd40b1024b203 success'
          gh run download 45998551314 --repo "$GITHUB_REPOSITORY" --pattern 'jar-worldlogic-1.21.1-neoforge-1.0.0-rc30-*' --dir core-rc30-inputs
          gh run download 45998551314 --repo "$GITHUB_REPOSITORY" --pattern 'qa-report-*' --dir core-rc30-inputs
          python -m pip install nbtlib==2.0.4
          PYTHONPATH=. python projects/worldlogic-terrain-1.21.1-neoforge/qa/worldgen_smoke.py natural-inputs native-water-qa core-rc30-inputs rc30
      - name: Fetch verified RC31 core and exercise water prediction
        if: always() && steps.terrain-artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46000227561" --jq '.head_sha + " " + .conclusion' | grep -Fx '33115368f2980b41a77b8964cd2dce87adf40a24 success'
          gh run download 46000227561 --repo "$GITHUB_REPOSITORY" --pattern 'jar-worldlogic-1.21.1-neoforge-1.0.0-rc31-*' --dir core-rc31-inputs
          gh run download 46000227561 --repo "$GITHUB_REPOSITORY" --pattern 'qa-report-*' --dir core-rc31-inputs
          PYTHONPATH=. python projects/worldlogic-terrain-1.21.1-neoforge/qa/worldgen_smoke.py natural-inputs predicted-water-qa core-rc31-inputs rc31
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldlogicterrain-natural-world-evidence
          path: |
            natural-world-qa/worldgen-report.json
            natural-world-qa/logs/
            unified-world-qa/worldgen-report.json
            unified-world-qa/logs/
            native-water-qa/worldgen-report.json
            native-water-qa/logs/
            predicted-water-qa/worldgen-report.json
            predicted-water-qa/logs/
          if-no-files-found: warn
