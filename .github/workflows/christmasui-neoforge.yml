name: Christmas UI NeoForge
on:
  push:
    branches: [main]
    paths:
      - 'projects/christmasui-neoforge/**'
      - '.github/workflows/christmasui-neoforge.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and package
        working-directory: projects/christmasui-neoforge
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify
        working-directory: projects/christmasui-neoforge
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from PIL import Image, ImageStat
          from io import BytesIO
          from pathlib import Path
          for f in [next(Path('build/libs').glob('*.jar')),]:
              with ZipFile(f) as z:
                  assert z.testzip() is None
                  images=[n for n in z.namelist() if n.endswith('.png')]
                  assert len(images)>50, len(images)
                  for n in images: Image.open(BytesIO(z.read(n))).verify()
                  assert 'assets/minecraft/textures/gui/sprites/widget/button.png.mcmeta' in z.namelist()
                  for name in ['container/inventory','container/creative_inventory/tab_items','sprites/hud/heart/full','sprites/server_list/join','title/background/panorama_0']:
                      assert 'assets/minecraft/textures/gui/'+name+'.png' in z.namelist(), name
                  if f.suffix=='.jar': assert 'dev/christmasui/client/TitleSnow.class' in z.namelist()
                  import json, hashlib
                  faces=[Image.open(BytesIO(z.read('assets/minecraft/textures/gui/title/background/panorama_'+str(i)+'.png'))).convert('RGB') for i in range(6)]
                  assert len({im.size for im in faces})==1
                  assert all(im.width==im.height and im.width>=256 and max(ImageStat.Stat(im).stddev)>=3 for im in faces)
                  assert len({hashlib.sha256(im.tobytes()).hexdigest() for im in faces})==6
                  assert 'PANORAMA-CREDITS.txt' in z.namelist()
                  events=json.loads(z.read('assets/minecraft/sounds.json'))
                  assert all(events[e]['replace'] for e in ['music.menu','music.game','music.overworld.frozen_peaks','music.creative'])
                  assert z.read('assets/minecraft/sounds/music/christmas_calm.ogg')[:4]==b'OggS'
                  menu=events['music.menu']['sounds']
                  assert len(menu)==1 and menu[0]['name']=='minecraft:music/christmas_calm'
                  ingame=events['music.game']['sounds']
                  assert len(ingame)==5 and len({s['name'] for s in ingame})==5
                  hashes=set()
                  for entry in ingame+menu:
                      assert entry['stream'] is True
                      data=z.read('assets/minecraft/sounds/'+entry['name'].split(':',1)[1]+'.ogg')
                      assert data[:4]==b'OggS' and b'\x01vorbis' in data[:512]
                      hashes.add(hashlib.sha256(data).hexdigest())
                  assert len(hashes)==6
                  assert all(v['sounds']==ingame for k,v in events.items() if k!='music.menu')
                  assert 'MUSIC-CREDITS.txt' in z.namelist()
                  for name in ['sprites/world_list/join','sprites/world_list/join_highlighted','sprites/widget/slider_handle','sprites/widget/locked_button','sprites/hud/hotbar_offhand_right']:
                      assert 'assets/minecraft/textures/gui/'+name+'.png' in z.namelist(),name
                  assert 'assets/minecraft/textures/item/empty_armor_slot_shield.png' in z.namelist()
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ci-christmasui-${GITHUB_RUN_NUMBER}" projects/christmasui-neoforge/build/libs/*.jar --target "$GITHUB_SHA" --title "Christmas UI 0.3.2" --notes "Gradle build and archive checks passed; in-game testing pending." --prerelease
