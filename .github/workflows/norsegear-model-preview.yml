name: Norse Gear 0.3.3 actual OBJ preview
on:
  push:
    branches: [main]
    paths:
      - 'projects/norsegear/src/main/resources/assets/norsegear/models/item/**'
      - 'projects/norsegear/tools/render_all_033.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: norsegear-model-preview-main
  cancel-in-progress: true
jobs:
  render-models:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Render real OBJ game assets
        working-directory: projects/norsegear
        run: python tools/render_all_033.py
      - name: Commit generated preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/norsegear/PREVIEW_ALL_24_ACTUAL_033.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs(norsegear): generate real 0.3.3 item model contact sheet'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
