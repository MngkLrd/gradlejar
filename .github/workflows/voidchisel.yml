name: Void Chisel JAR

on:
  push:
    branches: [main]
    paths:
      - 'projects/voidchisel/**'
      - '.github/workflows/voidchisel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile NeoForge mod
        working-directory: projects/voidchisel
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify jar, recipe and texture
        working-directory: projects/voidchisel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          jar = Path('build/libs/voidchisel-1.21.1-1.0.0.jar')
          assert jar.exists(), 'Missing compiled mod JAR'
          with zipfile.ZipFile(jar) as z:
              names = set(z.namelist())
              for name in [
                  'META-INF/neoforge.mods.toml',
                  'dev/voidchisel/BedrockMiningEvents.class',
                  'assets/voidchisel/textures/item/void_chisel.png',
                  'data/voidchisel/recipe/void_chisel.json'
              ]:
                  assert name in names, f'Missing resource: {name}'
              recipe = json.loads(z.read('data/voidchisel/recipe/void_chisel.json'))
              assert recipe['pattern'] == [' W ', 'NSN', ' S '], recipe
              assert recipe['key']['S']['item'] == 'minecraft:stick'
          print('Verified compiled JAR, recipe and textures')
          PY
      - name: Publish compiled jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ci-voidchisel-mc1.21.1-v1.0.0-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" projects/voidchisel/build/libs/voidchisel-1.21.1-1.0.0.jar \
            --target "$GITHUB_SHA" \
            --title "Void Chisel 1.0.0 | NeoForge 1.21.1" \
            --notes "Five-use bedrock tool. Crafted with Nether Star, 2 Netherite Ingots and 2 Sticks. Compiled in GitHub Actions; in-game playtest pending." \
            --prerelease
