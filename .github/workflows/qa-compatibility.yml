name: QA v2 modpack compatibility
on:
  workflow_dispatch:
    inputs:
      pack:
        description: 'Pack manifest ID from tools/qa/packs'
        required: true
        default: physics
        type: string
  pull_request:
    branches: [worldlogic-hydration-0.1.0, worldlogic-hydration-0.5.0, worldlogic-hydration-0.5.1-material-physics]
    paths:
      - 'projects/worldlogic-trauma-1.21.1-neoforge/**'
      - 'projects/hydration-1.21.1-neoforge/**'
      - tools/qa/packs/worldlogic-hydration.json
      - tools/qa/scenarios/worldlogic-trauma-hydration-pack.json
  push:
    branches: [main]
    paths:
      - 'tools/qa/packs/**'
      - tools/qa/pack.py
      - tools/qa/server.py
      - tools/qa/scenarios/fragileglass.json
      - tools/qa/scenarios/naturalbuoyancy-water.json
      - 'shared/fragileglass/**'
      - 'projects/fragileglass-fabric-26.3/**'
      - 'projects/fragileglass-neoforge-26.3/**'
      - 'projects/naturalbuoyancy-fabric-26.3/**'
      - 'projects/naturalbuoyancy-neoforge-26.3/**'
      - .github/workflows/qa-compatibility.yml
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      members: ${{ steps.plan.outputs.members }}
      targets: ${{ steps.plan.outputs.targets }}
      pack: ${{ steps.pack.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pack
        id: pack
        env:
          PACK_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.pack || (github.event_name == 'pull_request' && (github.head_ref == 'worldlogic-hydration-0.5.0' || github.head_ref == 'worldlogic-hydration-0.5.1-material-physics' || github.head_ref == 'worldlogic-hydration-0.5.2-rc54') && 'worldlogic-hydration') || 'physics' }}
        run: |
          [[ "$PACK_ID" =~ ^[a-z][a-z0-9_-]{0,60}$ ]]
          echo "id=$PACK_ID" >> "$GITHUB_OUTPUT"
      - name: Validate manifest and plan build matrix
        id: plan
        env:
          PACK_ID: ${{ steps.pack.outputs.id }}
        run: python3 -m tools.qa.pack plan "$PACK_ID"
  build-members:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJSON(needs.plan.outputs.members) }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve project
        id: profile
        env:
          PROJECT: ${{ matrix.member.project }}
        run: python3 tools/resolve_project.py "$PROJECT" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.profile.outputs.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.profile.outputs.gradle }}
          cache-read-only: true
      - name: Fetch exact RC54 Core candidate from upstream run
        if: github.head_ref == 'worldlogic-hydration-0.5.2-rc54' && matrix.member.slug == 'hydration'
        uses: actions/download-artifact@v4
        with:
          name: qa-candidate-NOT-RELEASE-0-1
          run-id: 46103365227
          github-token: ${{ github.token }}
          path: pinned-rc54
      - name: Verify pinned Core binary for Hydration compilation
        if: github.head_ref == 'worldlogic-hydration-0.5.2-rc54' && matrix.member.slug == 'hydration'
        shell: bash
        run: |
          set -euo pipefail
          jar="$GITHUB_WORKSPACE/pinned-rc54/worldlogic-neoforge-mc1.21.1-1.2.1.jar"
          echo "33d2ce25db884ba8f3044d672f5970430de968c863b83372ed188774572cfb56  $jar" | sha256sum -c -
          echo "HYDRATION_CORE_JAR=$jar" >> "$GITHUB_ENV"
      - name: Compile production mod (no dev fallback)
        env:
          PROJECT: ${{ matrix.member.project }}
        run: |
          cd "$PROJECT"
          gradle --no-daemon --stacktrace clean build
      - name: Verify exact final JAR
        id: jar
        env:
          PROJECT: ${{ matrix.member.project }}
        run: python3 tools/verify_build_output.py "$PROJECT"
      - name: Stage member with source and hash evidence
        env:
          PACK_ID: ${{ needs.plan.outputs.pack }}
          MEMBER: ${{ matrix.member.key }}
          JAR: ${{ steps.jar.outputs.jar_path }}
        run: python3 -m tools.qa.pack stage "$PACK_ID" "$MEMBER" "$JAR" member-output
      - uses: actions/upload-artifact@v4
        with:
          name: compat-member-${{ matrix.member.key }}-${{ github.run_attempt }}
          path: member-output/
          retention-days: 7
          if-no-files-found: error
      - name: Test Hydration production JAR with exact upstream RC54 binary
        if: github.head_ref == 'worldlogic-hydration-0.5.2-rc54' && matrix.member.slug == 'hydration'
        env:
          HYDRATION_JAR: ${{ steps.jar.outputs.jar_path }}
        run: |
          python3 projects/hydration-1.21.1-neoforge/qa/exact_core_runtime.py
      - name: Upload exact upstream binary runtime evidence
        if: always() && github.head_ref == 'worldlogic-hydration-0.5.2-rc54' && matrix.member.slug == 'hydration'
        uses: actions/upload-artifact@v4
        with:
          name: hydration-rc54-exact-binary-evidence-${{ github.run_attempt }}
          path: |
            hydration-exact-evidence/report.json
            hydration-exact-evidence/runtime/logs/
          if-no-files-found: warn
          retention-days: 30
  compatibility:
    needs: [plan, build-members]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.target.java }}
      - name: Retrieve exact target members
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: compat-member-${{ matrix.target.id }}--*-${{ github.run_attempt }}
          path: pack-members
      - name: Run all gameplay scenarios together
        env:
          PACK_ID: ${{ needs.plan.outputs.pack }}
          TARGET: ${{ matrix.target.id }}
        run: python3 -m tools.qa.pack test "$PACK_ID" "$TARGET" pack-members pack-evidence
      - name: Upload compact compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-report-${{ needs.plan.outputs.pack }}-${{ matrix.target.id }}-${{ github.run_attempt }}
          path: pack-evidence/compatibility-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-logs-${{ needs.plan.outputs.pack }}-${{ matrix.target.id }}-${{ github.run_attempt }}
          path: pack-evidence/runtime/logs/
          if-no-files-found: ignore
          retention-days: 7
