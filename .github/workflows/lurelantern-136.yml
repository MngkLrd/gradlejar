name: Lure Lantern 1.3.6 NeoForge JAR
on:
  push:
    branches: [lurelantern-136-modes-preview]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/lurelantern-1.3.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build NeoForge and verify original binary
        run: gradle --no-daemon clean build --stacktrace
      - name: Run real NeoForge GameTest server (NBT and three modes)
        run: gradle --no-daemon runGameTestServer --stacktrace
      - name: Check JAR and original features
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          jar=pathlib.Path('build/libs/lurelantern-1.3.6.jar')
          assert jar.is_file()
          with zipfile.ZipFile(jar) as z:
              bad=z.testzip()
              assert bad is None, bad
              names=set(z.namelist())
              import struct,hashlib
              for texture in ['lure_lantern.png','lure_lantern_active.png','advanced_lure_lantern.png','advanced_lure_lantern_active.png']:
                  blob=z.read('assets/lurelantern/textures/block/'+texture)
                  assert blob[:8] == b'\x89PNG\r\n\x1a\n'
                  assert struct.unpack('>II',blob[16:24]) == (16,16),(texture,'not 16x16')
              assert b'lurelantern' in z.read('META-INF/neoforge.mods.toml')
              for path in [
                  'com/kirill/lurelantern/block/LureLanternBlock.class',
                  'com/kirill/lurelantern/item/LureLanternBlockItem.class',
                  'com/kirill/lurelantern/blockentity/LureLanternBlockEntity.class',
                  'com/kirill/lurelantern/blockentity/LureLanternBlockEntity$LureMode.class',
                  'com/kirill/lurelantern/util/CapturedMobData.class',
                  'com/kirill/lurelantern/util/LureLanternLogic.class',
                  'com/kirill/lurelantern/client/CapturedMobRenderer.class',
                  'com/kirill/lurelantern/client/ClientRenderRegistration.class',
                  'com/kirill/lurelantern/logic/SafeLanternDrops.class',
                  'assets/lurelantern/textures/entity/preview_aura.png',
                  'assets/lurelantern/lang/en_us.json',
                  'assets/lurelantern/lang/ru_ru.json',
                  'assets/lurelantern/textures/block/advanced_lure_lantern.png',
                  'assets/lurelantern/textures/block/advanced_lure_lantern_active.png',
                  'assets/lurelantern/textures/block/lure_lantern.png',
                  'assets/lurelantern/textures/block/lure_lantern_active.png',
                  'data/lurelantern/recipe/lure_lantern.json',
                  'data/lurelantern/recipe/advanced_lure_lantern.json',
                  'data/lurelantern/loot_table/blocks/advanced_lure_lantern.json',
                  'META-INF/neoforge.mods.toml',
              ]:
                  assert path in names,path
              assert b'version="1.3.6"' in z.read('META-INF/neoforge.mods.toml')
          print('JAR static check OK; byte size:',jar.stat().st_size)
          PY
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="lurelantern-1.3.6-${GITHUB_SHA:0:9}"
          gh release create "$tag" build/libs/lurelantern-1.3.6.jar --prerelease --title "Lure Lantern 1.3.6 (NeoForge 1.21.1)" --notes "Three advanced modes (off, lure, auto-capture) and smoothly rotating, size-fitted mob preview with category-based pixel aura. Original recipes, drop handler, NBT and vanilla-style textures retained. Source: ${GITHUB_SHA}. Build and automated server GameTest verified. Client visual checks still required."
