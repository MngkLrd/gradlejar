name: UMBRAL NeoForge JAR
on:
  push:
    branches: [main]
    paths:
      - 'projects/umbral-neoforge/**'
      - '.github/workflows/umbral-neoforge.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile
        working-directory: projects/umbral-neoforge
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify geometry and JAR
        working-directory: projects/umbral-neoforge
        run: |
          java -cp build/classes/java/main dev.umbral.shadow.ProjectionMath
          python3 - <<'PY'
          from zipfile import ZipFile
          import json,struct,zlib
          with ZipFile('build/libs/umbral-neoforge-1.21.1-0.1.0.jar') as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for c in ['Umbral','block/ProjectorBlock','block/ShadowBlock','shadow/ProjectionMath','shadow/Projection','shadow/ShadowData','shadow/ShadowNetwork']:
                  assert 'dev/umbral/'+c+'.class' in names,c
              for n in ['META-INF/neoforge.mods.toml','pack.mcmeta','assets/umbral/blockstates/shadow_matter.json','assets/umbral/textures/block/shadow_top.png','assets/umbral/textures/block/shadow_side.png','assets/umbral/textures/block/projector_front_lit.png','assets/umbral/textures/item/umbral_lens.png']:
                  assert n in names,n
              for n in names:
                  if n.endswith('.json') or n=='pack.mcmeta':json.loads(z.read(n))
                  if n.endswith('.png'):
                      p=z.read(n);assert p[:8]==b'\x89PNG\r\n\x1a\n',n
                      assert struct.unpack('>II',p[16:24])==(16,16),n
                      pos=8
                      while pos<len(p):
                          size=struct.unpack('>I',p[pos:pos+4])[0]
                          body=p[pos+4:pos+8+size]
                          assert zlib.crc32(body)==struct.unpack('>I',p[pos+8+size:pos+12+size])[0],n
                          pos+=size+12
              assert len(json.loads(z.read('assets/umbral/blockstates/shadow_matter.json'))['multipart'])==16
              assert not any(n.startswith('net/minecraft/') for n in names)
          PY
      - name: Publish JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ci-umbral-neoforge-${GITHUB_RUN_NUMBER}" projects/umbral-neoforge/build/libs/umbral-neoforge-1.21.1-0.1.0.jar --target "$GITHUB_SHA" --title "UMBRAL 0.1.0 (NeoForge 1.21.1)" --notes "Compiled, projection invariants and JAR resources verified. Standalone mod. In-game test pending." --prerelease
