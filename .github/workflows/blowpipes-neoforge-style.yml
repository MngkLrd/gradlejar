name: Blowpipes NeoForge 1.21.1 Vanilla Art
on:
  push:
    branches:
      - feature/blowpipes-neo121-vanilla-art
    paths:
      - 'tools/blowpipes_style_guided.py'
      - '.github/workflows/blowpipes-neoforge-style.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - name: Generate NeoForge sources and pixel-art models
        run: |
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          src=zlib.decompress(base64.b64decode(Path('tools/blowpipes_generator.b64').read_text()))
          Path('tools/blowpipes_generate.py').write_bytes(src)
          PY
          sed -i 's@ROOT = Path(__file__).resolve().parent@ROOT = Path(__file__).resolve().parent.parent@' tools/blowpipes_generate.py
          python3 tools/blowpipes_generate.py
          python3 - <<'PY'
          from pathlib import Path
          d=Path('blowpipes-neoforge-1.21.1')
          p=d/'src/main/java/dev/minemods/blowpipes/DartProjectile.java'
          s=p.read_text()
          s=s.replace('@Override protected float getGravity(){return 0.025f;}', '')
          s=s.replace('target.setSecondsOnFire(3)', 'target.igniteForSeconds(3)')
          p.write_text(s)
          gradle=d/'build.gradle'
          s=gradle.read_text().replace("version='1.0.0'","version='1.1.0'")
          gradle.write_text(s)
          meta=d/'src/main/resources/META-INF/neoforge.mods.toml'
          s=meta.read_text().replace('version="1.0.0"','version="1.1.0"')
          meta.write_text(s)
          PY
          python3 tools/blowpipes_style_guided.py blowpipes-neoforge-1.21.1
      - name: Build real mod with NeoForge Gradle
        working-directory: blowpipes-neoforge-1.21.1
        run: gradle --no-daemon --stacktrace clean build
      - name: Validate compiled classes, pixel density and asset references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,struct,json
          jar=Path('blowpipes-neoforge-1.21.1/build/libs/blowpipes-neoforge-1.21.1-1.1.0.jar')
          assert jar.is_file() and jar.stat().st_size>8000,jar
          with zipfile.ZipFile(jar) as z:
            assert z.testzip() is None
            names=set(z.namelist())
            for cls in ('Blowpipes','BlowpipeItem','DartProjectile','BlowpipesClient'):
              assert 'dev/minemods/blowpipes/'+cls+'.class' in names,cls
            assert 'META-INF/neoforge.mods.toml' in names
            assert 'version="1.1.0"' in z.read('META-INF/neoforge.mods.toml').decode()
            ids=['bamboo_blowpipe','hunting_blowpipe','reinforced_blowpipe','plain_dart','iron_dart','poison_dart','slowness_dart','fire_dart','sleep_dart']
            for item in ids:
              prefix='assets/blowpipes/'
              png=prefix+'textures/item/'+item+'.png'
              j=prefix+'models/item/'+item+'.json'
              assert png in names and j in names,item
              assert struct.unpack('>II',z.read(png)[16:24])==(16,16),item
              data=json.loads(z.read(j))
              if item.endswith('blowpipe'):
                assert len(data['elements']) in (3,4)
                assert prefix+'textures/item/'+item+'_3d.png' in names
                assert prefix+'textures/item/'+item+'_end.png' in names
                for el in data['elements']:
                  assert all(isinstance(x,int) for x in el['from']+el['to'])
                  for face in el['faces'].values():
                    assert all(isinstance(x,int) and 0<=x<=16 for x in face['uv'])
              assert 'data/blowpipes/recipe/'+item+'.json' in names
            print('SUCCESS verified real build',jar,'bytes',jar.stat().st_size)
          PY
      - name: Publish JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=blowpipes-neoforge-1.21.1/build/libs/blowpipes-neoforge-1.21.1-1.1.0.jar
          tag="blowpipes-neoforge-1.21.1-v1.1.0-style-$GITHUB_RUN_NUMBER"
          gh release create "$tag" "$jar" --target "$GITHUB_SHA" --title "Blowpipes 1.1.0 | NeoForge 1.21.1 | Native 16x16 Art" --notes "Nine native 16x16 item icons, integer-pixel 3D models, matching material colors. Java 21 and NeoForge 21.1.x. Compiled and asset-validated in CI; not tested in-game." --prerelease
