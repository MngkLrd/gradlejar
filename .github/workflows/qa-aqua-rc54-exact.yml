name: Aqua 1.5.1 exact-binary integration diagnostics
on:
  push:
    branches: [worldlogic-aquaculture-0.1.0]
    paths:
      - 'projects/worldlogic-aquaculture-1.21.1-neoforge/**'
      - 'tools/qa/scenarios/worldlogic-aquaculture.json'
      - '.github/workflows/qa-aqua-rc54-exact.yml'
permissions:
  contents: read
  actions: read
jobs:
  exact-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: true
      - name: Download original Core 1.5.1 test candidate
        uses: actions/download-artifact@v4
        with:
          name: jar-worldlogic-1.21.1-neoforge-1.5.1-0
          run-id: 46123087105
          github-token: ${{ github.token }}
          path: exact-core
      - name: Check original binary and compile Aqua against it
        run: |
          set -eu
          CORE="$PWD/exact-core/worldlogic-neoforge-mc1.21.1-1.5.1.jar"
          echo "a966fb939988e794586cd6a1ea18fafe340296447b67ef8a9827963328e20548  $CORE" | sha256sum -c -
          cd projects/worldlogic-aquaculture-1.21.1-neoforge
          gradle --no-daemon --stacktrace :clean :build -PworldlogicCoreJar="$CORE"
      - name: Verify actual Aqua JAR
        run: python3 tools/verify_build_output.py projects/worldlogic-aquaculture-1.21.1-neoforge
      - name: Run existing Aqua scenario with exact original Core binary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.qa.common import profile,sha256,write_json
          from tools.qa.server import run
          project="projects/worldlogic-aquaculture-1.21.1-neoforge"
          p=profile(project)
          jar=Path(project)/"build/libs"/p["jar_glob"]
          core=Path("exact-core/worldlogic-neoforge-mc1.21.1-1.5.1.jar")
          report={"schema":1,"kind":"aqua-exact-core-diagnostic","eligible":False,"status":"failed","checks":[],"qa_level":0,"core_origin_run":46123087105,"core_origin_artifact":15254721484,"core_sha256":sha256(core),"aqua_sha256":sha256(jar)}
          try:
              run(p,p["qa"],jar,Path("exact-evidence/runtime"),report,extra_jars=[core])
              assert report["qa_level"]==4
              assert report["installed_jars"][core.name]==report["core_sha256"]
              report["status"]="passed"
          except Exception as e:
              report["error"]=str(e)
              raise
          finally:
              write_json(Path("exact-evidence/report.json"),report)
          PY
      - name: Upload diagnostics and exact Aqua candidate (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqua-core151-NOT-RELEASE
          path: |
            projects/worldlogic-aquaculture-1.21.1-neoforge/build/libs/worldlogic_aqua-neoforge-mc1.21.1-0.4.7.jar
            exact-evidence/report.json
            exact-evidence/runtime/logs/
          if-no-files-found: warn
          retention-days: 7
