name: Anvil Right Click Repair NeoForge JAR
on:
  push:
    branches: [main]
    paths:
      - 'projects/anvilrightclickrepair-neoforge/**'
      - '.github/workflows/anvilrightclickrepair-neoforge.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile
        working-directory: projects/anvilrightclickrepair-neoforge
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify JAR
        working-directory: projects/anvilrightclickrepair-neoforge
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          import json
          with ZipFile('build/libs/anvilrightclickrepair-neoforge-1.21.1-0.1.0.jar') as z:
              assert z.testzip() is None
              names = set(z.namelist())
              for n in ['META-INF/neoforge.mods.toml','pack.mcmeta','dev/anvilrightclickrepair/AnvilRightClickRepair.class','dev/anvilrightclickrepair/RepairInteraction.class']:
                  assert n in names, n
              for n in names:
                  if n.endswith('.json') or n == 'pack.mcmeta':
                      json.loads(z.read(n))
              assert not any(n.startswith(('net/minecraft/','net/neoforged/')) for n in names)
          PY
      - name: Publish JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ci-anvilrightclickrepair-neoforge-${GITHUB_RUN_NUMBER}" projects/anvilrightclickrepair-neoforge/build/libs/anvilrightclickrepair-neoforge-1.21.1-0.1.0.jar --target "$GITHUB_SHA" --title "Anvil Right Click Repair 0.1.0 (NeoForge 1.21.1)" --notes "Compiled and JAR verified. In-game tests pending." --prerelease
