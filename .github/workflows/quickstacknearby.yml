name: Quick Stack Nearby Forge JAR
on:
  push:
    branches: [main]
    paths:
      - 'projects/quickstacknearby/**'
      - '.github/workflows/quickstacknearby.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile Forge mod
        working-directory: projects/quickstacknearby
        run: gradle --no-daemon --stacktrace clean build
      - name: Check JAR contents
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          jar = Path('projects/quickstacknearby/build/libs/quickstacknearby-forge-1.21.1-1.0.0.jar')
          assert jar.exists(), 'Missing production JAR'
          with ZipFile(jar) as z:
              required = [
                  'META-INF/mods.toml',
                  'dev/quickstacknearby/QuickStackNearby.class',
                  'dev/quickstacknearby/server/QuickStackService.class',
                  'dev/quickstacknearby/network/QuickStackNetwork.class'
              ]
              missing = [p for p in required if p not in z.namelist()]
              assert not missing, f'Missing: {missing}'
          print('Verified', jar)
          PY
      - name: Publish compiled JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ci-quickstacknearby-forge-1.21.1-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" projects/quickstacknearby/build/libs/quickstacknearby-forge-1.21.1-1.0.0.jar \
            --target "$GITHUB_SHA" \
            --title "Quick Stack Nearby 1.0.0 (Forge 1.21.1)" \
            --notes "CI-compiled release; in-game client and dedicated-server testing pending." \
            --prerelease
