name: Burning Arrows - eleven production JARs
on:
  push:
    branches: [burningarrows-1.0.0]
    paths:
      - 'tools/generate_burningarrows.py'
      - '.github/workflows/burning-arrows.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="burningarrows-v1.0.0-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Burning Arrows 1.0.0 - build $GITHUB_RUN_NUMBER" --notes "Build in progress. Gameplay testing not performed." --prerelease
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {loader: forge, mc: '1.20.1'}
          - {loader: neoforge, mc: '1.20.1'}
          - {loader: neoforge, mc: '1.21.1'}
          - {loader: neoforge, mc: '26.1.2'}
          - {loader: neoforge, mc: '26.2'}
          - {loader: neoforge, mc: '26.3'}
          - {loader: fabric, mc: '1.20.1'}
          - {loader: fabric, mc: '1.21.1'}
          - {loader: fabric, mc: '26.1.2'}
          - {loader: fabric, mc: '26.2'}
          - {loader: fabric, mc: '26.3'}
    steps:
      - uses: actions/checkout@v4
      - id: profile
        run: |
          dir=$(python3 tools/generate_burningarrows.py '${{ matrix.loader }}' '${{ matrix.mc }}')
          python3 tools/resolve_project.py "$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.profile.outputs.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.profile.outputs.gradle }}
      - name: Compile
        working-directory: ${{ steps.profile.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify binary
        id: verify
        run: python3 tools/verify_build_output.py '${{ steps.profile.outputs.project_dir }}'
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          JAR: ${{ steps.verify.outputs.jar_path }}
        run: |
          test -f "$JAR"
          unzip -t "$JAR"
          unzip -Z1 "$JAR" | grep -Fx 'dev/minemods/burningarrows/mixin/ArrowMixin.class'
          gh release upload "$TAG" "$JAR" --clobber
  package:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download eleven verified JARs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download "$TAG" --pattern 'burningarrows-*.jar' --dir compiled
      - name: Package exactly eleven loader-sorted JARs
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          matrix=[('Forge','forge','1.20.1')]+[(folder,loader,mc) for folder,loader in [('NeoForge','neoforge'),('Fabric','fabric')] for mc in ['1.20.1','1.21.1','26.1.2','26.2','26.3']]
          jars={p.name:p for p in Path('compiled').glob('*.jar')}
          assert len(jars)==11, list(jars)
          archive='Burning-Arrows-1.0.0-ALL-11-JARs.zip'
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as out:
              for folder,loader,mc in matrix:
                  name=f'burningarrows-{loader}-mc{mc}-1.0.0.jar'
                  path=jars[name]
                  with zipfile.ZipFile(path) as jar:
                      assert jar.testzip() is None
                      assert 'dev/minemods/burningarrows/mixin/ArrowMixin.class' in jar.namelist()
                  out.write(path,f'{folder}/{name}')
          with zipfile.ZipFile(archive) as out:
              assert len(out.namelist())==11 and all(n.endswith('.jar') for n in out.namelist())
              assert out.testzip() is None
          PY
      - name: Publish final archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" Burning-Arrows-1.0.0-ALL-11-JARs.zip --clobber
          gh release edit "$TAG" --notes "All eleven production JARs compiled and statically verified. ZIP contains only JAR files sorted by loader. In-game testing not performed."
