import java.security.MessageDigest
import java.util.zip.ZipFile
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = mod_group_id
version = mod_version
base.archivesName = 'worldlogic_trauma-neoforge-mc1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def coreJar = file('libs/worldlogic-neoforge-mc1.21.1-1.0.0-rc22.jar')
def coreVersion = '1.0.0-rc22'
def coreHash = '1c0d23ca034cd17f783e4d1abbf01f1eda8783ac0ba3b48cf6afdc1291d21dc8'
def coreUrl = 'https://github.com/MngkLrd/gradlejar/releases/download/ci-worldlogic-mc1.21.1-neoforge-1.0.0-rc22-1246-1/worldlogic-neoforge-mc1.21.1-1.0.0-rc22.jar'
def validCore = { File f ->
    f.isFile() && MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() == coreHash
}
def prepareCore = tasks.register('prepareWorldLogic') {
    outputs.file(coreJar)
    outputs.upToDateWhen { validCore(coreJar) }
    doLast {
        if (!validCore(coreJar)) {
            coreJar.parentFile.mkdirs()
            def tmp = new File(coreJar.parentFile,coreJar.name+'.tmp')
            try {
                def conn = new URI(coreUrl).toURL().openConnection()
                conn.connectTimeout=15000
                conn.readTimeout=60000
                conn.inputStream.withCloseable { input -> tmp.withOutputStream { output -> output << input } }
                if (!validCore(tmp)) throw new GradleException('World Logic RC22 SHA-256 mismatch')
                java.nio.file.Files.move(tmp.toPath(),coreJar.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } finally { tmp.delete() }
        }
        new ZipFile(coreJar).withCloseable { zip ->
            if(zip.getEntry('META-INF/neoforge.mods.toml')==null ||
               zip.getEntry('dev/minemods/worldlogic/api/WorldLogicApi.class')==null)
                throw new GradleException('Wrong World Logic API or loader')
        }
    }
}
repositories {
    maven { url = 'https://maven.blamejared.com/' }
    mavenCentral()
}
dependencies {
    compileOnly files(coreJar).builtBy(prepareCore)
    runtimeOnly files(coreJar).builtBy(prepareCore)
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
tasks.named('processResources', ProcessResources).configure {
    inputs.property('worldlogic_version',coreVersion)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_id:mod_id,mod_version:mod_version,worldlogic_version:coreVersion)
    }
}
tasks.withType(JavaCompile).configureEach {
    dependsOn prepareCore
    options.encoding='UTF-8'
    options.release=21
}
sourceSets {
    hudTest {
        java.srcDir 'src/hudTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('checkHudStatusLayout', JavaExec) {
    dependsOn tasks.named('hudTestClasses')
    classpath=sourceSets.hudTest.runtimeClasspath
    mainClass='dev.minemods.traumacraft.client.gui.HudStatusLayoutCheck'
}
tasks.named('check') { dependsOn tasks.named('checkHudStatusLayout') }
