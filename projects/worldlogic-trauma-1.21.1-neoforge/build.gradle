import java.security.MessageDigest
import java.util.zip.ZipFile
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = mod_group_id
version = mod_version
base.archivesName = 'worldlogic_trauma-neoforge-mc1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def coreJar = file('libs/worldlogic-neoforge-mc1.21.1-1.5.1.jar')
def coreVersion = '1.5.1'
def coreHash = 'a966fb939988e794586cd6a1ea18fafe340296447b67ef8a9827963328e20548'
// Exact Actions artifact 15254721484 from Core run 46123087105; no release substitution.
def validCore = { File f ->
    f.isFile() && MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() == coreHash
}
def prepareCore = tasks.register('prepareWorldLogic') {
    outputs.file(coreJar)
    outputs.upToDateWhen { validCore(coreJar) }
    doLast {
        if (!validCore(coreJar)) {
            coreJar.parentFile.mkdirs()
            def explicit = providers.gradleProperty('worldlogicCoreJar').orNull
            def cache = System.getenv('MINEMODS_DEP_CACHE')
            def source = explicit != null ? file(explicit) : cache != null ? new File(cache,coreHash) : null
            if (source == null || !validCore(source)) throw new GradleException('Exact Core 1.5.1 artifact required (SHA-256 '+coreHash+'); supply -PworldlogicCoreJar=/path/to/verified.jar or CI dependency cache')
            java.nio.file.Files.copy(source.toPath(),coreJar.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING);
        }
        new ZipFile(coreJar).withCloseable { zip ->
            if(zip.getEntry('META-INF/neoforge.mods.toml')==null ||
               zip.getEntry('dev/minemods/worldlogic/api/WorldLogicApi.class')==null || zip.getEntry('dev/minemods/worldlogic/api/PhysicalMaterials$SurfaceContact.class')==null)
                throw new GradleException('Wrong World Logic API or loader')
        }
    }
}
repositories {
    maven { url = 'https://maven.blamejared.com/' }
    mavenCentral()
}
dependencies {
    compileOnly files(coreJar).builtBy(prepareCore)
    runtimeOnly files(coreJar).builtBy(prepareCore)
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
tasks.named('processResources', ProcessResources).configure {
    inputs.property('worldlogic_version',coreVersion)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_id:mod_id,mod_version:mod_version,worldlogic_version:coreVersion)
    }
}
tasks.withType(JavaCompile).configureEach {
    dependsOn prepareCore
    options.encoding='UTF-8'
    options.release=21
}
sourceSets {
    hudTest {
        java.srcDir 'src/hudTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('checkHudStatusLayout', JavaExec) {
    dependsOn tasks.named('hudTestClasses')
    classpath=sourceSets.hudTest.runtimeClasspath
    mainClass='dev.minemods.traumacraft.client.gui.HudStatusLayoutCheck'
}
tasks.named('check') { dependsOn tasks.named('checkHudStatusLayout') }
