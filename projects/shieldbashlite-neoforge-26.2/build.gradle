plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'com.kirillmods'
version = '1.0.4'
base.archivesName = 'shieldbashlite-neoforge-26.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.2.0.93'
    runs { client { client() } }
    mods { shieldbashlite { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
