plugins { id 'java'; id 'idea'; id 'net.minecraftforge.gradle' version '[7.0.29,8.0)' }
group='dev.bearback'
version='0.2.2'
base.archivesName='bearback-forge-mc26.3'
java.toolchain.languageVersion=JavaLanguageVersion.of(25)
minecraft {
  mappings channel:'official',version:'26.3'
  runs {
    configureEach { workingDir.convention layout.projectDirectory.dir('run') }
    register('client')
    register('server'){ args '--nogui' }
  }
}
repositories { minecraft.mavenizer(it); maven fg.forgeMaven; maven fg.minecraftLibsMaven; mavenCentral() }
dependencies {
 implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.8')
 annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=25 }
