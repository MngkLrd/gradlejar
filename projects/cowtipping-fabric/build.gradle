plugins { id 'fabric-loom' version '1.11.8'; id 'maven-publish' }
version = project.mod_version
group = 'dev.cowtipping'
base { archivesName = 'cowtipping-fabric-1.21.1' }
repositories { mavenCentral() }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 mappings loom.officialMojangMappings()
 modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}
processResources {
 inputs.property 'version', project.version
 filesMatching('fabric.mod.json') { expand 'version':project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8';options.release=21 }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
