plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
group='dev.minemods.hydration'
version='0.6.0'
base.archivesName='hydration-neoforge-mc1.21.1'
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
evaluationDependsOn(':worldlogic')
def pinnedCore=System.getenv('HYDRATION_CORE_JAR')
dependencies { if(pinnedCore) implementation files(pinnedCore); else implementation project(':worldlogic') }
neoForge {
 version=project.neo_version
 runs { client { client() }; server { server(); programArgument '--nogui' } }
 mods { hydration { sourceSet(sourceSets.main) }; if(!pinnedCore) { worldlogic { sourceSet(project(':worldlogic').sourceSets.main) } } }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }

tasks.register('hydrationModelCheck', JavaExec) { dependsOn classes; classpath=sourceSets.main.runtimeClasspath; mainClass='dev.minemods.hydration.ModelChecks' }
tasks.named('check') { dependsOn tasks.named('hydrationModelCheck') }
