plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
group='dev.minemods.fragileglass'
version='1.0.2'
base.archivesName='fragileglass-neoforge-mc26.2'
java.toolchain.languageVersion=JavaLanguageVersion.of(25)
neoForge { version='26.2.0.90'; runs { client { client() }; server { server() } }; mods { fragileglass { sourceSet(sourceSets.main) } } }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=25 }

// Shared byte-identical sources; every target still compiles independently.
sourceSets.main.java.srcDir('../../shared/fragileglass/neoforge/src/main/java')
sourceSets.main.resources.srcDirs('../../shared/fragileglass/neoforge/src/main/resources', '../../shared/fragileglass/common/src/main/resources')
