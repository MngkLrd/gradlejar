plugins { id 'java-library'; id 'net.neoforged.moddev.legacyforge' version '2.0.147' }
group = 'dev.minemods.fooddigestion'
version = '1.0.0'
base.archivesName = 'fooddigestion-forge-mc1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
legacyForge {
    enable { forgeVersion = '1.20.1-47.3.0'; disableRecompilation = true }
    runs { client { client() } }
    mods { fooddigestion { sourceSet(sourceSets.main) } }
}
dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
mixin { add sourceSets.main, 'fooddigestion.refmap.json'; config 'fooddigestion.mixins.json' }
jar { manifest.attributes(['MixinConfigs': 'fooddigestion.mixins.json']) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.register('digestionSelfTest', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'dev.minemods.fooddigestion.DigestionTest' }
tasks.named('check') { dependsOn 'digestionSelfTest' }
