plugins {
 id 'java'
 id 'idea'
 id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}
group = 'dev.minemods.worldlogic'
version = '1.0.0-rc17'
base { archivesName = 'worldlogic-forge-mc1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft {
 mappings channel: 'official', version: '1.21.1'
 copyIdeResources = true
 runs {
  client { workingDirectory project.file('run'); args '--mixin.config', 'worldlogic.mixins.json'; mods { worldlogic { source sourceSets.main } } }
  server { workingDirectory project.file('run-server'); args '--nogui', '--mixin.config', 'worldlogic.mixins.json'; if(project.hasProperty('worldlogicCi')) property 'worldlogic.ci', 'true'; mods { worldlogic { source sourceSets.main } } }
 }
}
dependencies { minecraft "net.minecraftforge:forge:1.21.1-${forge_version}" }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }

// Forge 52 uses official names at runtime; these mixins explicitly opt out of remapping.
jar { manifest.attributes('MixinConfigs': 'worldlogic.mixins.json') }
