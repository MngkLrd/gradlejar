plugins { id 'java';id 'idea';id 'net.minecraftforge.gradle' version '[7.0.29,8.0)' }
group='dev.voidchisel'
version='1.1.3'
base.archivesName='voidpickaxe-forge-mc26.2'
java.toolchain.languageVersion=JavaLanguageVersion.of(25)
minecraft {
    mappings channel:'official',version:'26.2'
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            args '-mixin.config=voidpickaxe.mixins.json'
        }
        register('client')
        register('server'){args '--nogui'}
    }
}
repositories { minecraft.mavenizer(it); maven fg.forgeMaven; maven fg.minecraftLibsMaven; mavenCentral() }
dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.2-65.1.3')
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8';options.release=25 }
tasks.named('jar',Jar) { manifest { attributes['MixinConfigs']='voidpickaxe.mixins.json' } }
