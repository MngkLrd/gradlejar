plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
group = 'dev.minemods'
version = '0.6.1-rc1'
base.archivesName = 'worldlogic_thermal-neoforge-mc1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { worldlogic_thermal { sourceSet(sourceSets.main) } }
}
repositories { mavenCentral() }
def coreName = 'worldlogic-neoforge-mc1.21.1-1.0.0-rc22.jar'
def coreUrl = 'https://github.com/MngkLrd/gradlejar/releases/download/ci-worldlogic-mc1.21.1-neoforge-1.0.0-rc22-1246-1/worldlogic-neoforge-mc1.21.1-1.0.0-rc22.jar'
def expectedSha = '1c0d23ca034cd17f783e4d1abbf01f1eda8783ac0ba3b48cf6afdc1291d21dc8'
def coreJar = file(providers.gradleProperty('worldlogicJar').orElse('libs/'+coreName).get())
dependencies {
    implementation files(coreJar)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
tasks.register('verifyWorldLogic') {
    doLast {
        if (!coreJar.isFile()) {
            if (providers.gradleProperty('worldlogicJar').isPresent()) throw new GradleException('Explicit core path missing: ' + coreJar)
            coreJar.parentFile.mkdirs()
            def temp = new File(coreJar.parentFile,coreJar.name+'.part')
            try {
                def connection = new URI(coreUrl).toURL().openConnection()
                connection.connectTimeout=20000; connection.readTimeout=60000
                connection.inputStream.withCloseable { input -> temp.withOutputStream { out -> out << input } }
                def actual = java.security.MessageDigest.getInstance('SHA-256').digest(temp.bytes).encodeHex().toString()
                if (actual != expectedSha) throw new GradleException('WorldLogic download SHA-256 mismatch')
                java.nio.file.Files.move(temp.toPath(),coreJar.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } finally { temp.delete() }
        }
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(coreJar.bytes).encodeHex().toString()
        if (actual != expectedSha) throw new GradleException('WorldLogic RC22 SHA-256 mismatch: '+actual)
        new java.util.zip.ZipFile(coreJar).withCloseable { zip ->
            if (zip.getEntry('META-INF/neoforge.mods.toml') == null || zip.getEntry('dev/minemods/worldlogic/api/WorldLogicApi.class') == null)
                throw new GradleException('WorldLogic dependency has no NeoForge metadata or public API')
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyWorldLogic' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('test', Test) { useJUnitPlatform() }
