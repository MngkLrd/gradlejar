plugins {
 id 'java-library'
 id 'idea'
 id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.minemods.sleepdebt'
version = project.mod_version
base.archivesName = 'sleepdebt-' + project.minecraft_version
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
 version = project.neo_version
 runs {
  client { client() }
  server { server() }
 }
 mods {
  sleepdebt { sourceSet(sourceSets.main) }
 }
}
tasks.withType(JavaCompile).configureEach {
 options.encoding = 'UTF-8'
 options.release = 21
}

repositories {
 maven { name = 'WispForest'; url = 'https://maven.wispforest.io/releases' }
 maven { name = 'Su5ed'; url = 'https://maven.su5ed.dev/releases' }
 maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
 maven { name = 'EMI'; url = 'https://maven.terraformersmc.com/releases/' }
 maven {
  name = 'Modrinth'
  url = 'https://api.modrinth.com/maven'
 }
}
dependencies {
 compileOnly 'maven.modrinth:jade:15.10.6+neoforge'
 compileOnly 'io.wispforest:accessories-neoforge:1.1.0-beta.53+1.21.1'
 compileOnly 'mezz.jei:jei-1.21.1-common-api:19.21.0.247'
 compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247'
 compileOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1:api'
}



// Static PNG byte archive; installation copies bytes, never paints textures.
sourceSets.main.resources.exclude 'assets/sleepdebt/textures/**', 'assets/sleepdebt/shaders/**', 'assets/sleepdebt/sounds/**', 'assets/sleepdebt/sounds.json'
def artDir = layout.buildDirectory.dir('staticSleepAssets')
tasks.register('installStaticSleepArtwork', Exec) {
 inputs.files('tools/static_art_315.json','tools/install_static_art.py')
 outputs.dir(artDir)
 commandLine 'python3', 'tools/install_static_art.py', artDir.get().asFile.absolutePath
}
tasks.named('processResources') {
 dependsOn 'installStaticSleepArtwork'
 from(artDir)
}
