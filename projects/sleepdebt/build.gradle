plugins {
 id 'java-library'
 id 'idea'
 id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.minemods.sleepdebt'
version = project.mod_version
base.archivesName = 'sleepdebt-' + project.minecraft_version
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
 version = project.neo_version
 runs {
  client { client() }
  server { server() }
 }
 mods {
  sleepdebt { sourceSet(sourceSets.main) }
 }
}
tasks.withType(JavaCompile).configureEach {
 options.encoding = 'UTF-8'
 options.release = 21
}
tasks.register('generateSleepAssets', Exec) {
 commandLine 'python3', 'tools/generate_assets.py'
 outputs.dir('src/main/resources/assets/sleepdebt/textures')
}
tasks.named('processResources') { dependsOn('generateSleepAssets') }
