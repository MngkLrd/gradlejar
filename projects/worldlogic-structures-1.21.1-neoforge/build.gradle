plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
group='dev.minemods.worldlogicstructures'
version='0.2.0'
base.archivesName='worldlogic_structures-neoforge-mc1.21.1'
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
evaluationDependsOn(':worldlogic')
dependencies { implementation project(':worldlogic') }
neoForge {
