 mods { worldlogic_structures { sourceSet(sourceSets.main) }; worldlogic { sourceSet(project(':worldlogic').sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }
