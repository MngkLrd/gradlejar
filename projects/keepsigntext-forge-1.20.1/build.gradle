plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
}
group = 'com.kirill.keepsigntext'
version = '1.0.0'
base.archivesName = 'keepsigntext-forge-mc1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    enable { forgeVersion = '1.20.1-47.3.0'; disableRecompilation = true }
    runs { client { client() } }
    mods { keepsigntext { sourceSet(sourceSets.main) } }
}
dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin {
    add sourceSets.main, 'keepsigntext.refmap.json'
    config 'keepsigntext.mixins.json'
}
jar {
    manifest.attributes(['MixinConfigs': 'keepsigntext.mixins.json'])
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
