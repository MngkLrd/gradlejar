plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}
group = 'dev.minemods'
version = '0.4.0'
base { archivesName = 'layeredarmor' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
def generated = providers.exec {
    workingDir projectDir
    commandLine 'python3', '-c', 'import base64,tarfile,io,pathlib,subprocess,sys; p=pathlib.Path("source.tar.gz.b64"); t=tarfile.open(fileobj=io.BytesIO(base64.b64decode(p.read_text())),mode="r:gz"); t.extractall("."); import gzip; pathlib.Path("upgrade_020.py").write_bytes(gzip.decompress(base64.b64decode(pathlib.Path("upgrade_020.py.gz.b64").read_text()))); subprocess.check_call([sys.executable,"upgrade_020.py"]); pathlib.Path("upgrade_030.py").write_bytes(gzip.decompress(base64.b64decode(pathlib.Path("upgrade_030.py.gz.b64").read_text()))); subprocess.check_call([sys.executable,"upgrade_030.py"]); pathlib.Path("upgrade_040.py").write_bytes(gzip.decompress(base64.b64decode(pathlib.Path("upgrade_040.py.gz.b64").read_text()))); subprocess.check_call([sys.executable,"upgrade_040.py"])'
}.result.get()
if (generated.exitValue != 0) throw new GradleException('Source extraction failed')
neoForge {
    version = '21.1.80'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { layeredarmor { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
