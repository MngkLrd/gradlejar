import java.security.MessageDigest
import java.net.URI
plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
group='dev.minemods.worldlogicterrain'
version='1.6.2'
base.archivesName='worldlogicterrain-neoforge-mc1.21.1'
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
neoForge {
 version=project.neo_version
 runs { client { client() }; server { server(); programArgument '--nogui' } }
 mods { worldlogicterrain { sourceSet(sourceSets.main) } }
}
def coreUrl='https://api.github.com/repos/MngkLrd/gradlejar/actions/artifacts/15246915092/zip'
def coreHash='33d2ce25db884ba8f3044d672f5970430de968c863b83372ed188774572cfb56'
def coreJar=layout.buildDirectory.file('worldlogic-dependency/worldlogic-neoforge-mc1.21.1-1.2.1.jar')
def digest={ File f -> MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }
def fetchCore=tasks.register('fetchWorldLogic') {
 inputs.property('url',coreUrl)
 inputs.property('sha256',coreHash)
 outputs.file(coreJar)
 outputs.upToDateWhen { coreJar.get().asFile.isFile() && digest(coreJar.get().asFile)==coreHash }
 doLast {
  File out=coreJar.get().asFile
  out.parentFile.mkdirs()
  File tmp=new File(out.parentFile,out.name+'.tmp')
  // Diagnostic CI preloads the actual RC54 JAR from the exact artifact into the QA dependency cache.
  def cacheDir=System.getenv('MINEMODS_DEP_CACHE')
  File cached=cacheDir ? new File(cacheDir,coreHash) : null
  if(cached?.isFile()) {
   if(digest(cached)!=coreHash) throw new GradleException('WorldLogic core checksum mismatch in dependency cache')
   java.nio.file.Files.copy(cached.toPath(),out.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
   return
  }
  if(coreUrl.endsWith('/zip')) throw new GradleException('RC54 is NOT-RELEASE; exact artifact must be preloaded in MINEMODS_DEP_CACHE for diagnostic integration only')
  def connection=URI.create(coreUrl).toURL().openConnection()
  connection.connectTimeout=30000
  connection.readTimeout=90000
  connection.setRequestProperty('User-Agent','MineMods-Gradle')
  try {
   connection.inputStream.withCloseable { input -> tmp.withOutputStream { output -> output << input } }
   if(digest(tmp)!=coreHash) throw new GradleException('WorldLogic core checksum mismatch')
   java.nio.file.Files.move(tmp.toPath(),out.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
  } finally { tmp.delete() }
 }
}
dependencies { implementation(files(coreJar).builtBy(fetchCore)) }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }

 // Original, species-specific aquatic art is part of the production resource contract.
tasks.register('verifyBenthicArt') {
    def names = ['eelgrass','sea_lettuce','sargassum','giant_kelp','red_dulse','coralline_algae','red_sea_star','blue_sea_star','sea_urchin','barrel_sponge','sea_anemone','sea_fan','mussel_bed','widgeon_grass','water_milfoil','hornwort','pondweed','water_crowfoot','river_moss','water_starwort']
    def root = file('src/main/resources/assets/worldlogicterrain')
    inputs.files(names.collectMany { n -> [new File(root,"textures/block/${n}.png"),new File(root,"textures/item/${n}.png"),new File(root,"models/block/${n}.json"),new File(root,"models/item/${n}.json")] })
    doLast {
        def hashes = [] as Set
        def json = new groovy.json.JsonSlurper()
        names.each { n ->
            def tex = new File(root,"textures/block/${n}.png")
            def image = javax.imageio.ImageIO.read(tex)
            if(image==null || image.width!=32 || image.height!=32 || !hashes.add(digest(tex))) throw new GradleException("Missing, malformed or duplicate original aquatic texture: ${n}")
            def model = json.parse(new File(root,"models/block/${n}.json"))
            def expected = "worldlogicterrain:block/${n}".toString()
            if(!model.elements || !model.textures.values().every { it==expected }) throw new GradleException("Aquatic model uses unrelated material: ${n}")
            model.elements.each { el ->
                el.faces.each { face, f ->
                    if(!(f.texture in ['#main','#accent']) || f.uv?.size()!=4 || f.uv.any { it<0 || it>16 } || f.uv[2]<=f.uv[0] || f.uv[3]<=f.uv[1]) throw new GradleException("Invalid aquatic UV: ${n} ${face}")
                    def size = [el.to[0]-el.from[0],el.to[1]-el.from[1],el.to[2]-el.from[2]]
                    def width = face in ['east','west'] ? size[2] : size[0]
                    def height = face in ['up','down'] ? size[2] : size[1]
                    if((f.uv[2]-f.uv[0])*2!=width || (f.uv[3]-f.uv[1])*2!=height) throw new GradleException("Aquatic UV density mismatch: ${n} ${face}")
                }
            }
            def item = json.parse(new File(root,"models/item/${n}.json"))
            def iconFile = new File(root,"textures/item/${n}.png")
            def icon = javax.imageio.ImageIO.read(iconFile)
            if(icon==null || icon.width!=16 || icon.height!=16 || !icon.colorModel.hasAlpha() || !hashes.add(digest(iconFile))) throw new GradleException("Missing, malformed or duplicate aquatic inventory icon: ${n}")
            if(item.parent!='minecraft:item/generated' || item.textures?.layer0!="worldlogicterrain:item/${n}".toString()) throw new GradleException("Aquatic item must use its own sprite: ${n}")
        }
        logger.lifecycle("Verified original block textures, dedicated item icons and 1:1 UVs for ${names.size()} benthic species")
    }
}
tasks.named('processResources') { dependsOn tasks.named('verifyBenthicArt') }
