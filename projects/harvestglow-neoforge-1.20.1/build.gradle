plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
}
group = 'com.kirill.harvestglow'
version = '1.1.0'
base.archivesName = 'harvestglow-neoforge-mc1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
legacyForge {
    enable { neoForgeVersion = '1.20.1-47.1.106'; disableRecompilation = true }
    runs { client { client() } }
    mods { harvestglow { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
