plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
group='dev.minemods.metabolism'
version='0.2.0'
base.archivesName='metabolism-neoforge-mc1.21.1'
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
evaluationDependsOn(':worldlogic')
dependencies { implementation project(':worldlogic') }
neoForge {
 version=project.neo_version
 runs { client { client() }; server { server(); programArgument '--nogui' } }
 mods { metabolism { sourceSet(sourceSets.main) }; worldlogic { sourceSet(project(':worldlogic').sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }
tasks.register('metabolismModelCheck', JavaExec) { dependsOn classes; classpath=sourceSets.main.runtimeClasspath; mainClass='dev.minemods.metabolism.ModelChecks' }
tasks.named('check') { dependsOn tasks.named('metabolismModelCheck') }
