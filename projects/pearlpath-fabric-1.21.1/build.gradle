plugins {
  id 'net.fabricmc.fabric-loom-remap' version '1.11.8'
  id 'maven-publish'
}
group = 'dev.minemods'
version = '1.0.2'
base.archivesName = 'pearlpath-fabric-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
dependencies {
  minecraft 'com.mojang:minecraft:1.21.1'
  mappings loom.officialMojangMappings()
  modImplementation 'net.fabricmc:fabric-loader:0.17.3'
  modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
