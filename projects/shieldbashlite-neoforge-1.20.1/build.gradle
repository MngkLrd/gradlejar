plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
}

group = 'com.kirillmods'
version = '1.0.4'
base.archivesName = 'shieldbashlite-neoforge-1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    enable {
        neoForgeVersion = project.minecraft_version + '-' + project.loader_version
        disableRecompilation = true
    }
    runs {
        client { client() }
        server { server() }
    }
    mods { shieldbashlite { sourceSet(sourceSets.main) } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
