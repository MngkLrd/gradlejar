import groovy.json.JsonOutput
import java.awt.Color
import java.awt.Graphics2D
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

// UV-aware hand-painted creature textures, generated without third-party libraries.
// These DO NOT replace vanilla mobs, only Halo Haven's new entity IDs.
tasks.named('generateHaloAssets').configure {
    doLast {
        File assets=layout.buildDirectory.dir('generated/haloassets').get().asFile
        def c={ value ->new Color((int)value,true)}
        def f={ Graphics2D g,color,int x,int y,int width,int height ->
            g.setColor(c(color)); g.fillRect(x,y,width,height)
        }
        def ln={Graphics2D g,color,int x1,int y1,int x2,int y2->
            g.setColor(c(color));g.drawLine(x1,y1,x2,y2)
        }
        def save={String name,BufferedImage img->
            File dest=new File(assets,'assets/halohaven/textures/entity/'+name+'.png')
            dest.parentFile.mkdirs();ImageIO.write(img,'PNG',dest)
        }
        // Face geometry maps to the actual 1.21.1 VillagerModel head UVs.
        BufferedImage sky=new BufferedImage(64,64,BufferedImage.TYPE_INT_ARGB)
        Graphics2D g=sky.createGraphics()
        f(g,0xffd7bb99,0,0,64,64)
        // Ivory hair and gilded hood. Front face: 8..15 / 8..17.
        f(g,0xffe9d2ad,0,0,32,20)
        f(g,0xffefe4c9,8,0,8,7)
        f(g,0xffd7b56f,8,8,8,2)
        f(g,0xfff7e7c7,8,10,8,8)
        f(g,0xff5d88a0,10,12,2,1)
        f(g,0xff5d88a0,14,12,2,1)
        f(g,0xff273a50,11,12,1,1)
        f(g,0xff273a50,15,12,1,1)
        f(g,0xffc99a81,12,15,2,1)
        f(g,0xffc49e82,24,4,2,9) // long nose texture
        f(g,0xfff0cda6,26,6,4,8)
        f(g,0xffcaa56d,26,7,1,5)
        // Hood overlay UV 32..63.
        f(g,0xfff4dfbb,32,0,32,20)
        f(g,0xffc8a35f,40,8,8,2)
        f(g,0xffa8c1b6,40,10,2,8)
        f(g,0xffa8c1b6,46,10,2,8)
        f(g,0xfff6eccb,41,8,6,1)
        // Robe main UV. Side panels, cuff, solar clasp, belt and embroidered hems.
        f(g,0xff547f87,16,20,24,28)
        f(g,0xff699ba1,20,21,14,20)
        f(g,0xffd7bf8a,22,21,9,2)
        f(g,0xfff5e7c3,24,25,6,2)
        f(g,0xffdfb974,26,29,3,3)
        f(g,0xffffecb8,27,30,1,1)
        f(g,0xff294858,22,35,12,2)
        f(g,0xffedca84,22,37,12,2)
        for(int y=40;y<=47;y+=2){
            ln(g,0xfff1d7a2,18,y,37,y)
        }
        f(g,0xff447782,44,22,20,27)
        f(g,0xffa4c4bd,48,22,5,22)
        f(g,0xffc6ad7d,45,36,16,2)
        f(g,0xffe4d6ba,45,41,16,2)
        f(g,0xff385b72,0,22,16,42)
        for(int y=30;y<=62;y+=7)ln(g,0xffd6ba80,0,y,16,y)
        f(g,0xfff8ecdc,6,44,4,12)
        f(g,0xffe6bc7d,7,51,2,3)
        g.dispose();save('skyfolk',sky)
        // Cloudhares are pastel-lilac bunnies with icy ears and indigo patches.
        BufferedImage hare=new BufferedImage(64,64,BufferedImage.TYPE_INT_ARGB)
        g=hare.createGraphics();f(g,0xffe9dce8,0,0,64,64)
        for(int y=0;y<64;y+=8) {
            f(g,0xfff6ecf5,0,y,64,2)
            for(int x=0;x<64;x+=16)f(g,0xffdccce2,x+(y%16),y+3,6,2)
        }
        f(g,0xfff6ecf4,0,0,32,16)
        f(g,0xffd9a8cd,8,0,3,13)
        f(g,0xffd9a8cd,20,0,3,13)
        f(g,0xfffff4fd,9,8,13,8)
        f(g,0xff394866,12,10,2,2)
        f(g,0xff394866,19,10,2,2)
        f(g,0xffe09cb6,16,13,2,2)
        f(g,0xffd7c3e0,0,23,64,27)
        f(g,0xfffaf1f2,5,27,52,14)
        f(g,0xffa7b8d4,37,32,9,5)
        f(g,0xffedc6df,14,39,11,3)
        g.dispose();save('cloudhare',hare)
        // Lumen silk body with an opaline mask and patterned translucent wings.
        BufferedImage lumen=new BufferedImage(64,64,BufferedImage.TYPE_INT_ARGB)
        g=lumen.createGraphics();f(g,0xffa2d9d2,0,0,64,64)
        for(int y=0;y<64;y+=12){
            f(g,0xffbcefe2,0,y,64,3)
            ln(g,0xfff5fff5,0,y+3,63,y+3)
        }
        f(g,0xffe8fff3,7,8,17,9)
        f(g,0xff6489a6,11,10,2,2)
        f(g,0xff6489a6,20,10,2,2)
        f(g,0xff2c657c,12,10,1,1);f(g,0xff2c657c,21,10,1,1)
        f(g,0xfff6dbb2,15,14,3,1)
        f(g,0xff77b7bb,17,19,28,24)
        f(g,0xffe0f8e7,22,21,17,17)
        f(g,0xff7daab3,27,24,9,11)
        f(g,0xfffee4aa,31,27,3,5)
        f(g,0xffffffff,32,28,1,2)
        for(int x : [2,47]){
            f(g,0xff81c1c3,x,24,15,22)
            f(g,0xffd8ffec,x+2,24,9,19)
            f(g,0xffa7dddc,x+3,28,7,2)
            f(g,0xfff0e1b1,x+4,36,5,1)
        }
        g.dispose();save('lumen',lumen)
        // Golem: true 128px painting over golem UVs, layered ivory plating,
        // gold ribs, turquoise runes, weathering and pale luminous shoulders.
        BufferedImage golem=new BufferedImage(128,128,BufferedImage.TYPE_INT_ARGB)
        g=golem.createGraphics()
        f(g,0xffd9dbd3,0,0,128,128)
        for(int y=0;y<128;y+=16){
            f(g,0xffecede3,0,y,128,3)
            ln(g,0xffadbdba,0,y+8,127,y+8)
        }
        for(int x=0;x<128;x+=23){
            f(g,0xffc8cec8,x,0,3,128)
            f(g,0xfff7f3e9,x+4,0,2,128)
        }
        // Head: dark eyes and antique diadem.
        f(g,0xfff6edda,8,8,36,20)
        f(g,0xffc8a66a,8,8,36,3)
        f(g,0xff97ccd0,13,15,8,4)
        f(g,0xff97ccd0,29,15,8,4)
        f(g,0xffe4ffff,15,16,3,2);f(g,0xffe4ffff,31,16,3,2)
        f(g,0xffb98b5d,23,21,8,2)
        // Body breastplate, waist gem and a broad sweep of golden seams.
        f(g,0xfff2efe3,28,45,72,47)
        f(g,0xffb9975f,30,47,68,4)
        f(g,0xff97c4c9,37,52,53,8)
        f(g,0xfff9e8ba,39,53,49,3)
        f(g,0xffd5ad76,60,61,9,18)
        f(g,0xff6db5bc,56,62,17,12)
        f(g,0xffe8ffff,62,65,5,5)
        f(g,0xffb28f60,30,82,68,5)
        for(int x=37;x<=91;x+=11){
            f(g,0xffc39b61,x,51,3,32)
            f(g,0xffffe8b9,x+1,53,1,20)
        }
        // Arms, shoulders and shinguards have crisp geometric trims.
        for(int x : [3,99]){
            f(g,0xfff2e6d1,x,42,24,56)
            f(g,0xffd6ae74,x,46,24,4)
            f(g,0xffa2cfd0,x+3,55,18,7)
            f(g,0xff567b8e,x+5,63,14,9)
            f(g,0xffc8a06c,x+2,86,20,4)
        }
        g.dispose();save('dawn_guardian',golem)
        // Dusk Wraith: midnight cloth, ink ribbons, and sharp prismatic eyes.
        BufferedImage wraith=new BufferedImage(64,64,BufferedImage.TYPE_INT_ARGB)
        g=wraith.createGraphics();f(g,0xff30324f,0,0,64,64)
        for(int y=0;y<64;y+=13){
            ln(g,0xff4b4b76,0,y,63,y+2)
            ln(g,0xff212440,0,y+4,63,y+6)
        }
        f(g,0xff443b64,0,0,32,19)
        f(g,0xff252744,8,8,16,9)
        f(g,0xff8af2ec,10,11,5,2)
        f(g,0xff8af2ec,19,11,5,2)
        f(g,0xffffffff,12,11,1,1)
        f(g,0xffffffff,20,11,1,1)
        f(g,0xffbb93b7,15,15,4,1)
        f(g,0xff26283d,16,22,32,28)
        for(int i=0;i<4;i++) {
            int y=24+i*6
            ln(g,0xff76669e,17,y,46,y+3)
            ln(g,0xff5b5685,18,y+1,43,y+4)
        }
        f(g,0xff8ee5e5,29,28,6,11)
        f(g,0xfff0e9dc,31,31,2,5)
        f(g,0xff5e4e78,0,40,64,13)
        g.dispose();save('dusk_wraith',wraith)
        // A small twinkling ring texture, built for the 3D halo geometry.
        BufferedImage ring=new BufferedImage(32,32,BufferedImage.TYPE_INT_ARGB)
        Graphics2D halo=ring.createGraphics()
        for(int y=0;y<32;y++)for(int x=0;x<32;x++){
            int glow= y<3||y>28 ? 40 : y<7||y>24?120 : 225
            int r=Math.min(255,209+(31-y)%24),gr=Math.min(255,176+x%39),b=120+y%25
            ring.setRGB(x,y,(glow<<24)|(r<<16)|(gr<<8)|b)
        }
        halo.dispose();save('halo_ring',ring)
    }
}
