import groovy.json.JsonOutput
import java.awt.Color
import java.awt.Graphics2D
import java.awt.RenderingHints
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

/*
 * Halo Haven Atelier. Every block has a *material grammar*, not a noise recipe.
 * 32 logical pixels (upscaled nearest-neighbour to 64), limited named palettes.
 * Solid forms -> structural wear -> one intentional focus, never scatter noise.
 * Each texture is a face of a tileable 3D block, not a standalone painting.
 */
tasks.named('generateHaloAssets').configure {
    doLast {
        File root=layout.buildDirectory.dir('generated/haloassets').get().asFile
        def rr={Graphics2D g,Object c,int x,int y,int w,int h ->
            g.setColor(new Color((int)c,true));g.fillRect(x,y,w,h)
        }
        def ln={Graphics2D g,Object c,int x,int y,int xx,int yy ->
            g.setColor(new Color((int)c,true));g.drawLine(x,y,xx,yy)
        }
        def px={Graphics2D g,Object c,int x,int y->
            g.setColor(new Color((int)c,true));g.fillRect(x,y,1,1)
        }
        def paint={String name,Object base,Closure art ->
            BufferedImage draft=new BufferedImage(32,32,BufferedImage.TYPE_INT_ARGB)
            Graphics2D g=draft.createGraphics()
            rr(g,base,0,0,32,32)
            art(g)
            g.dispose()
            // Native resolution remains compatible with models referencing 64px
            // while two-pixel brush units eliminate sub-pixel fuzz.
            BufferedImage out=new BufferedImage(64,64,BufferedImage.TYPE_INT_ARGB)
            Graphics2D og=out.createGraphics()
            og.setRenderingHint(RenderingHints.KEY_INTERPOLATION,
                RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
            og.drawImage(draft,0,0,64,64,null)
            og.dispose()
            File f=new File(root,'assets/halohaven/textures/block/'+name+'.png')
            f.parentFile.mkdirs();ImageIO.write(out,'PNG',f)
            Set<Integer> palette=[] as Set
            for(int y=0;y<32;y++)for(int x=0;x<32;x++)palette.add(draft.getRGB(x,y))
            if(palette.size()>12)throw new GradleException(
                'Uncontrolled color palette in '+name+': '+palette.size())
            println('Halo Atelier: '+name+' '+palette.size()+' colors, 32px logical, no sampled noise')
        }
        // GEOLOGY: horizontal sediment bands, a few real branching fractures.
        paint('cloudstone',0xffe8eee6){g->
            for(int y:[5,15,26]){
                rr(g,0xffcad9d4,0,y,32,1)
                rr(g,0xfffafbf1,0,y+1,32,1)
            }
            rr(g,0xffdbe6de,0,0,32,2)
            ln(g,0xffc5d4d2,7,6,9,9);ln(g,0xffc5d4d2,9,9,8,12)
            ln(g,0xffc5d4d2,25,16,23,19);ln(g,0xffc5d4d2,23,19,26,23)
            ln(g,0xfff8f8f0,2,23,12,23)
        }
        // LAND: two large connected plant clusters, rather than 100 loose pixels.
        paint('skygrass',0xff8cbfa5){g->
            rr(g,0xff99ccaf,0,0,32,6)
            rr(g,0xffa3d5b3,0,17,32,4)
            for(List<Integer> xy:[[7,9],[23,24],[25,7]]){
                int x=xy[0],y=xy[1]
                ln(g,0xff558e78,x,y+2,x,y-3)
                rr(g,0xffb8ddc0,x-3,y-1,3,2)
                rr(g,0xff67a98b,x+1,y-3,3,2)
                px(g,0xffeff1d5,x,y-4)
            }
            rr(g,0xffa1ceb0,3,21,4,2)
            rr(g,0xff9acbab,16,6,6,3)
        }
        // Two authored compositions avoid identical clover stamps on each cube.
        paint('skygrass_sparse',0xff8cbfa5){g->
            rr(g,0xff94c8a9,0,0,15,4)
            rr(g,0xff99caab,3,4,6,3)
            rr(g,0xff9ccdaf,23,18,9,5)
            rr(g,0xff74b397,1,26,7,2)
            ln(g,0xff5b987e,6,17,6,11)
            rr(g,0xffb0d8b8,3,12,3,2)
            rr(g,0xff6fac90,7,11,3,2)
            rr(g,0xffe7eac6,5,10,2,1)
        }
        paint('skygrass_dense',0xff8cbfa5){g->
            rr(g,0xff99cdae,0,2,21,6)
            rr(g,0xffa1d4b3,14,5,18,4)
            rr(g,0xff7eb89c,18,22,14,5)
            for(List<Integer> xy:[[5,20],[14,13],[25,16],[29,27]]){
                int x=xy[0],y=xy[1]
                ln(g,0xff578e79,x,y+2,x,y-3)
                rr(g,0xffb9dfc2,x-3,y-1,3,2)
                rr(g,0xff6caf8e,x+1,y-3,3,2)
                px(g,0xfff8e9b8,x,y-4)
            }
            rr(g,0xffabd6b4,9,25,8,3)
        }
        paint('skygrass_side',0xffd9e7db){g->
            rr(g,0xff9acbab,0,0,32,5)
            rr(g,0xff77b596,0,4,32,2)
            for(int x=1;x<32;x+=5){
                rr(g,0xff8cc5a2,x,6,2,3+(x%3))
                rr(g,0xffa4d6ad,x+2,7,1,2)
            }
            rr(g,0xffc7d8d0,0,13,32,1)
            rr(g,0xffe9efe5,0,14,32,1)
            rr(g,0xffcadad3,0,24,32,1)
            rr(g,0xfff3f1e7,0,25,32,1)
            ln(g,0xffb8d0c7,11,15,9,21)
        }
        // ARCHITECTURE: mortar, bevel and dressed stone in predictable courses.
        paint('pearl_bricks',0xffe9eee8){g->
            for(int row=0;row<4;row++){
                int y=row*8
                rr(g,0xffaebfc1,0,y,32,1)
                rr(g,0xfffafaf2,0,y+1,32,1)
                rr(g,0xffd6dede,0,y+7,32,1)
                int off=(row%2==0)?0:8
                for(int x=-16+off;x<=32;x+=16){
                    rr(g,0xffadbec0,x,y,1,8)
                    rr(g,0xfffafaf0,x+1,y+1,1,5)
                }
            }
        }
        paint('sungold_tiles',0xffbd8b4f){g->
            for(int y=0;y<32;y+=8){
                int off=(y/8%2==0)?0:8
                rr(g,0xffedcd8d,0,y,32,1)
                rr(g,0xff986e43,0,y+7,32,1)
                for(int x=-16+off;x<48;x+=16){
                    rr(g,0xff986e43,x,y,1,8)
                    rr(g,0xfff9df9d,x+1,y+1,1,4)
                    rr(g,0xffce9d5d,x+3,y+2,10,2)
                    rr(g,0xfff0c982,x+4,y+2,7,1)
                }
            }
        }
        // WOOD: repeated direction and restrained grain.
        paint('azure_planks',0xff699ea4){g->
            for(int y=0;y<32;y+=8){
                rr(g,0xff345d6b,0,y,32,1)
                rr(g,0xffacd3cf,0,y+1,32,1)
                rr(g,0xff7aadb0,0,y+4,32,1)
                rr(g,0xff8cbdbe,4,y+3,17,1)
                int x=(y/8%2==0)?7:23
                rr(g,0xff3c6b78,x,y+2,1,5)
                rr(g,0xffb8d8d1,x+1,y+2,1,4)
            }
        }
        // SPECIAL MATERIALS: 5-6 tones, forms belong to crystal/ore lattice.
        paint('moonstone',0xff7774a8){g->
            rr(g,0xff8f8abe,0,0,32,8)
            rr(g,0xff686893,0,23,32,9)
            ln(g,0xffb2a9d5,0,17,14,3)
            ln(g,0xffc9bde3,1,18,15,4)
            ln(g,0xff5d618d,15,3,27,17)
            ln(g,0xffab9dce,0,28,9,19)
            ln(g,0xffb8adda,20,32,31,20)
            rr(g,0xffe5ddf3,20,7,3,1)
        }
        paint('celestial_mosaic',0xffe7e6d8){g->
            rr(g,0xffb2bdb6,0,0,32,1)
            rr(g,0xffb2bdb6,0,31,32,1)
            rr(g,0xffb2bdb6,0,0,1,32)
            rr(g,0xffb2bdb6,31,0,1,32)
            for(int x=4;x<28;x++)for(int y=4;y<28;y++){
                int d=Math.abs(x-15)+Math.abs(y-15)
                if(d==13)px(g,0xffb18d62,x,y)
                if(d==12)px(g,0xfff4c991,x,y)
                if(d==5)px(g,0xff79aeb1,x,y)
            }
            rr(g,0xffecca88,14,13,4,5)
            rr(g,0xfffef1ce,15,14,2,3)
        }
        paint('gilded_pillar',0xffa47c50){g->
            for(int x=0;x<32;x+=8){
                rr(g,0xff735942,x,0,1,32)
                rr(g,0xffefd399,x+1,0,2,32)
                rr(g,0xffc49d63,x+3,0,2,32)
            }
            rr(g,0xfff6e1ab,0,0,32,2)
            rr(g,0xff876442,0,3,32,1)
            rr(g,0xff856345,0,28,32,1)
            rr(g,0xfff1d7a3,0,30,32,2)
        }
        paint('gilded_pillar_top',0xffb48b54){g->
            for(int d=1;d<=4;d++){
                g.setColor(new Color((int)(d%2==0?0xffebc982:0xff7d6043),true))
                g.drawRect(d,d,31-2*d,31-2*d)
            }
            rr(g,0xffe8d09b,9,9,14,14)
            rr(g,0xffa78551,11,11,10,10)
            rr(g,0xfff5e4b7,14,14,4,4)
        }
        paint('cloud_lantern',0xff9ed8d2){g->
            rr(g,0xff4f8591,0,0,32,3)
            rr(g,0xff4f8591,0,29,32,3)
            rr(g,0xff4f8591,0,0,3,32)
            rr(g,0xff4f8591,29,0,3,32)
            rr(g,0xffd3f2e8,5,5,22,22)
            rr(g,0xfff0f5dc,9,9,14,14)
            rr(g,0xfffff9dc,12,12,8,8)
            rr(g,0xff77babb,14,1,4,5)
            rr(g,0xff77babb,14,26,4,5)
        }
        paint('waystone',0xff405571){g->
            rr(g,0xff5c7791,0,0,32,3)
            rr(g,0xff2c3d60,0,29,32,3)
            for(int x=3;x<29;x++)for(int y=3;y<29;y++){
                int d=Math.abs(x-15)+Math.abs(y-15)
                if(d==17)px(g,0xffd5b476,x,y)
                if(d==16)px(g,0xff6aa1a7,x,y)
                if(d==8)px(g,0xff85c4bc,x,y)
            }
            rr(g,0xfff5e7bc,14,9,4,13)
            rr(g,0xfff5e7bc,9,14,13,4)
            rr(g,0xffffffff,15,15,2,2)
        }
        paint('pilgrim_altar',0xff394b61){g->
            for(int i=2;i<7;i+=2){
                g.setColor(new Color((int)(i==2?0xffb09061:0xffe3c288),true))
                g.drawRect(i,i,31-i*2,31-i*2)
            }
            for(int d=4;d<14;d+=3){
                ln(g,0xff6aaeb2,16-d,16,16+d,16)
                ln(g,0xff6aaeb2,16,16-d,16,16+d)
            }
            rr(g,0xffe6cf99,13,13,7,7)
            rr(g,0xfff5edd0,15,15,3,3)
        }
        paint('starshade',0xff2e395f){g->
            rr(g,0xff46577c,0,0,32,2)
            rr(g,0xff262c4d,0,30,32,2)
            for(int d=2;d<=11;d+=3){
                ln(g,0xff7da8b9,16-d,16,16+d,16)
                ln(g,0xff7da8b9,16,16-d,16,16+d)
            }
            rr(g,0xffe8e5be,13,13,7,7)
            rr(g,0xffffffff,15,15,3,3)
        }
        paint('star_ore',0xff7c91a3){g->
            rr(g,0xff9eafb2,0,0,32,5)
            rr(g,0xff6d849a,0,23,32,9)
            ln(g,0xff465c79,5,31,12,21)
            ln(g,0xffa7e7e4,12,21,15,12)
            ln(g,0xff9bd4d7,15,12,23,4)
            ln(g,0xffd8f7ed,15,12,20,16)
            ln(g,0xffe8f9eb,12,21,17,24)
            rr(g,0xfff4f8e7,14,14,3,3)
        }
        // Stained glass: a clear *pane* with a structural leading grid.
        def glass={String name,Object rim,Object glow,Object light ->
            paint(name,0x665b9fa3){g->
                rr(g,rim,0,0,32,2);rr(g,rim,0,30,32,2)
                rr(g,rim,0,0,2,32);rr(g,rim,30,0,2,32)
                for(int x=2;x<30;x++)for(int y=2;y<30;y++){
                    int d=Math.abs(x-15)+Math.abs(y-15)
                    if(d==15||d==14)px(g,light,x,y)
                    if(d==5)px(g,glow,x,y)
                }
                rr(g,glow,14,13,4,6)
                rr(g,light,15,14,2,4)
            }
        }
        glass('aurora_glass',0xff57899c,0xccd4f6ed,0xdd91c9c6)
        glass('dawn_glass',0xff98764d,0xccffe5b4,0xddcca777)
        // A natural canopy, not a repeated four-square electronic pattern.
        // Broad overlapping clusters hold shape from afar; asymmetric edge
        // strokes and muted leaf shadow avoid noisy speckles.
        paint('sky_leaves',0xff6fae93){g->
            rr(g,0xff5b9981,0,0,14,11)
            rr(g,0xff85c29f,2,2,10,5)
            rr(g,0xffb6ddbd,5,1,6,3)
            rr(g,0xff6fae93,12,0,15,8)
            rr(g,0xff98cead,16,2,13,5)
            rr(g,0xffb6ddbd,22,1,7,3)
            rr(g,0xff4f8c7b,26,7,6,10)
            rr(g,0xff85c29f,20,10,9,7)
            rr(g,0xff98cead,23,9,6,3)
            rr(g,0xff4f8c7b,0,17,10,15)
            rr(g,0xff85c29f,1,19,14,8)
            rr(g,0xffb6ddbd,2,17,8,4)
            rr(g,0xff5b9981,12,12,13,16)
            rr(g,0xff76b69b,13,15,14,10)
            rr(g,0xffb6ddbd,16,14,6,5)
            rr(g,0xff85c29f,23,23,9,9)
            rr(g,0xffb6ddbd,24,26,6,4)
            rr(g,0xff6fae93,8,29,14,3)
            // Short shadow boundaries read as layered leaf clumps.
            ln(g,0xff4f8c7b,4,10,10,10)
            ln(g,0xff5b9981,16,25,24,25)
            ln(g,0xffb6ddbd,17,4,27,4)
        }
        // A cutout plane: stem below, two leaf pairs, five petals at the apex.
        paint('celestial_bloom',0x00000000){g->
            rr(g,0xff468776,15,11,2,20)
            rr(g,0xff73ad82,12,19,3,2)
            rr(g,0xff73ad82,17,23,4,2)
            rr(g,0xffdbe6dc,12,7,8,8)
            rr(g,0xfff3e5bc,13,4,6,7)
            rr(g,0xffb7d9cf,9,10,5,4)
            rr(g,0xffb7d9cf,18,10,5,4)
            rr(g,0xffffefc2,15,10,3,3)
        }
        // Multiple cohesive soil compositions, sampled via weighted blockstates.
        // Models share the same sandstone underside and grass side: no UV seams.
        def json={String path,Object value->
            File dest=new File(root,path)
            dest.parentFile.mkdirs()
            dest.setText(JsonOutput.prettyPrint(JsonOutput.toJson(value)),'UTF-8')
        }
        for(String variant:['skygrass_sparse','skygrass_dense']){
            json('assets/halohaven/models/block/'+variant+'.json',[
                parent:'minecraft:block/cube_bottom_top',
                textures:[top:'halohaven:block/'+variant,
                          bottom:'halohaven:block/cloudstone',
                          side:'halohaven:block/skygrass_side']
            ])
        }
        json('assets/halohaven/blockstates/skygrass.json',[
            variants:['':[
                [model:'halohaven:block/skygrass',weight:5],
                [model:'halohaven:block/skygrass_sparse',weight:3],
                [model:'halohaven:block/skygrass_dense',weight:2]
            ]]
        ])
    }
}
