import groovy.json.JsonOutput
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

def generatedHaloAssets = layout.buildDirectory.dir('generated/haloassets')
tasks.register('generateHaloAssets') {
    outputs.dir(generatedHaloAssets)
    doLast {
        File base = generatedHaloAssets.get().asFile
        def writeJson = { String path, Object data ->
            File f = new File(base, path); f.parentFile.mkdirs()
            f.setText(JsonOutput.prettyPrint(JsonOutput.toJson(data)), 'UTF-8')
        }
        def writePng = { String path, BufferedImage image ->
            File f = new File(base,path); f.parentFile.mkdirs(); ImageIO.write(image,'PNG',f)
        }
        List blocks=['cloudstone','skygrass','pearl_bricks','sungold_tiles','azure_planks','aurora_glass','starshade','dawn_glass','moonstone','celestial_mosaic','gilded_pillar','cloud_lantern','waystone','star_ore']
        Map palettes=[
            cloudstone:[0xe4f2f0,0xeaf5f1,0xf8faf2,0xcedfdc,0xe6e5dc],
            skygrass:[0x9ad9c2,0x9edfc8,0xb8ebd4,0x86c8b2,0xa7e7cf],
            pearl_bricks:[0xebebe2,0xf4f2e8,0xd3dfe0,0xffffff,0xe6e9e3],
            sungold_tiles:[0xc89b51,0xdbac60,0xeac77e,0xf0d595,0xb68b4d],
            azure_planks:[0x72afb8,0x85c1c5,0x98d2d0,0x71aaa7,0xa0d2d4],
            aurora_glass:[0x9acfd9,0xb6dfe3,0xd8f3f3,0xb6d9ef,0xc7e8db],
            starshade:[0x304c79,0x395a86,0x4a6598,0x536ca0,0x3c5480],
            dawn_glass:[0xd8af69,0xffe8b7,0xd6b47d,0xffdeb2,0xe7b973],
            moonstone:[0x716fa7,0x8386bd,0xaaaed1,0x5a5b91,0x9396c2],
            celestial_mosaic:[0xe7e7da,0xf5efdc,0xe0d4be,0xc8d9d2,0xf8f6ea],
            gilded_pillar:[0xb8894b,0xd7a95c,0xf8d48e,0x947444,0xf1c780],
            cloud_lantern:[0xa9d8d8,0xbbe9e5,0xe6fff8,0x88acb8,0xd7fff1],
            waystone:[0x485f89,0x526f9b,0x6684ac,0x354870,0x7488ae],
            star_ore:[0x8995ab,0xa8b3c3,0x677b9a,0x758a9f,0xb8bfd0]
        ]
        blocks.eachWithIndex { String name,int seed ->
            BufferedImage image=new BufferedImage(32,32,BufferedImage.TYPE_INT_ARGB)
            List palette=palettes[name]
            for(int y=0;y<32;y++)for(int x=0;x<32;x++){
                int noise=Math.floorMod((x*19273)^(y*49199)^(x*y*617)^(seed*7411),29)
                int c=(int)palette[noise<3?3:noise<11?0:noise<17?1:noise<24?2:4]
                if(name=='cloudstone'){
                    if((x+2*y)%19==0 && y%7==2)c=0xc6d9e0
                    if(y%16==0 && x%8<2)c=0xffffff
                }else if(name=='skygrass'){
                    if((x%11==4&&y%13==6)||(x%13==8&&y%11==5))c=0xe1fff1
                    if(x%13==9&&y%11==5)c=0xffd8dc
                    if(x%7==4&&y%5==2)c=0x7cbba8
                }else if(name=='pearl_bricks'){
                    int shift=((int)(y/10)%2)*8
                    if(y%10<2||(x+shift)%16==0)c=0xaabdc1
                    else if(y%10==2||(x+shift)%16==1)c=0xfffefa
                    else if((x+y)%17==0)c=0xf6dca0
                }else if(name=='sungold_tiles'){
                    if(x%16==0||y%16==0)c=0x9e7845
                    else if(x%16==1||y%16==1)c=0xffe4a3
                    else if(x%16==8&&y%16==8)c=0xfff1c9
                    else if((x+y)%23==0)c=0xffd993
                }else if(name=='azure_planks'){
                    if(y%8==0)c=0x487989
                    else if(y%8==1)c=0xb5dfdc
                    else if(y%8==7)c=0x689da9
                    if((x==3||x==27)&&y%8==4)c=0xd8e7df
                }else if(name=='aurora_glass'){
                    if(x%16==0||y%16==0)c=0x609baf
                    else if(x%16==1||y%16==1)c=0xe6faff
                    else if((x+y)%22<3)c=0xdff9f5
                    else if((x-y+32)%19<3)c=0x91c0d9
                 }else if(name=='starshade'){
                    int dx=x-15,dy=y-15,dist=Math.abs(dx)+Math.abs(dy)
                    if((Math.abs(dx)<2&&Math.abs(dy)<12)||(Math.abs(dy)<2&&Math.abs(dx)<12)||(dist<10&&Math.abs(dx)==Math.abs(dy)))c=0xe3f5ee
                    if(dist<5)c=0xffedb3
                    if(dist<2)c=0xffffff
                    if(x%15==5&&y%13==3)c=0xffffff
                }else if(name=='moonstone'){
                    if(y%16==0)c=0x495a84
                    if((x+y*2)%31==0)c=0xe8e1ff
                    if((x+9)%23==0&&y%7<4)c=0xd1bbec
                }else if(name=='celestial_mosaic'){
                    int dx=Math.abs(x%16-7),dy=Math.abs(y%16-7)
                    if(dx+dy==7)c=0xba935b
                    if(dx+dy==6)c=0xffd89d
                    if(dx<=1&&dy<=1)c=0xf3dfbd
                    if(dx+dy==2)c=0x7fbdc4
                }else if(name=='gilded_pillar'){
                    if(x%8==0)c=0x795b43
                    else if(x%8==1)c=0xffe1a2
                    if(y%16==0)c=0xfce8c3
                    if(y%16==1)c=0x98714a
                }else if(name=='cloud_lantern'){
                    if(x<3||x>28||y<3||y>28)c=0x6da0a2
                    else if(x==4||x==27||y==4||y==27)c=0xffe8a4
                    else if((x+y)%11<3)c=0xedffff
                    else c=0xb0e8dc
                }else if(name=='waystone'){
                    int dx=Math.abs(x-15),dy=Math.abs(y-15),dist=dx+dy
                    if(dist==14||dist==13)c=0xe9ba6b
                    if(dist<6&&dist>4)c=0x8ae8e9
                    if(dx<2&&dy<9)c=0xebdfb5
                    if(dy<2&&dx<9)c=0xf0d991
                    if(dx<2&&dy<2)c=0xffffff
                }else if(name=='star_ore'){
                    if((x-8)*(x-8)+(y-10)*(y-10)<18 || (x-21)*(x-21)+(y-23)*(y-23)<12)c=0xaeecf0
                    if((x-8)*(x-8)+(y-10)*(y-10)<5 || (x-21)*(x-21)+(y-23)*(y-23)<4)c=0xf5ffff
                    if((x+y)%29==2)c=0xe8d0aa
                }
                int alpha=255
                if(name=='aurora_glass'||name=='dawn_glass'){
                    int d=Math.min(Math.min(x,31-x),Math.min(y,31-y))
                    alpha=d<2?245:(d==2?175:0)
                    if((x==15||x==16||y==15||y==16)&&d<7)alpha=135
                    if((x-y+32)%23==0 && d>4 && d<13)alpha=55
                    if(d>2&&d<6&&x%3==0&&y%3==0)alpha=35
                }
                image.setRGB(x,y,(int)((((long)alpha)<<24)|(c&0xffffff)))
            }
            writePng('assets/halohaven/textures/block/'+name+'.png',image)
            writeJson('assets/halohaven/blockstates/'+name+'.json',[variants:['':[model:'halohaven:block/'+name]]])
            writeJson('assets/halohaven/models/block/'+name+'.json',[
                parent:'minecraft:block/cube_all',
                ambientocclusion: !(name in ['aurora_glass','dawn_glass']),
                render_type:(name in ['aurora_glass','dawn_glass'] ? 'minecraft:translucent' : 'minecraft:solid'),
                textures:[all:'halohaven:block/'+name]])
            writeJson('assets/halohaven/models/item/'+name+'.json',[parent:'halohaven:block/'+name])
            writeJson('data/halohaven/loot_table/blocks/'+name+'.json',[
                type:'minecraft:block',pools:[[rolls:1,entries:[[type:'minecraft:item',name:'halohaven:'+name]]]]
            ])
        }
        BufferedImage sigil=new BufferedImage(32,32,BufferedImage.TYPE_INT_ARGB)
        for(int y=0;y<32;y++)for(int x=0;x<32;x++){
            double d=Math.sqrt((x-15.5)*(x-15.5)+(y-15.5)*(y-15.5))
            int col=0,dx=Math.abs(x-16),dy=Math.abs(y-16)
            if(d>=9&&d<=12)col=0xffc68b38
            if(d>=9.5&&d<=10.4)col=0xffffe3a0
            if(d<7.5&&d>6.7)col=0xff8de9ef
            if((dx<=1&&dy<=8)||(dy<=1&&dx<=8)||(dx==dy&&dx<=5))col=0xffe0fff7
            if(dx<=2&&dy<=2)col=0xffffecae
            if(dx<=1&&dy<=1)col=0xffffffff
            sigil.setRGB(x,y,col)
        }
        writePng('assets/halohaven/textures/item/ascension_sigil.png',sigil)
        BufferedImage berry=new BufferedImage(32,32,BufferedImage.TYPE_INT_ARGB)
        for(int y=0;y<32;y++)for(int x=0;x<32;x++){
            int col=0
            for(List spec : [[12,17,6],[20,18,6],[16,23,6]]){
                int dx=x-(int)spec[0],dy=y-(int)spec[1],r=(int)spec[2]
                if(dx*dx+dy*dy<=r*r)col=dx+dy<-3?0xffd9b8ee:0xff816eab
                if(dx*dx+dy*dy<r*r&&(dx+y)%6==1)col=0xff9a84c7
                if(dx==-2&&dy==-2)col=0xfff6e5ff
            }
            if(y>=8&&y<=15&&Math.abs(x-16)<=1)col=0xff457665
            if(y>=8&&y<=12&&x>=9&&x<=16&&x+y>=21)col=0xff6fc5a2
            if(y>=8&&y<=12&&x>=16&&x<=24&&x-y>=5)col=0xff91dcc0
            berry.setRGB(x,y,col)
        }
        writePng('assets/halohaven/textures/item/skyberry.png',berry)
        ['ascension_sigil','skyberry'].each { String n ->
            writeJson('assets/halohaven/models/item/'+n+'.json',[parent:'minecraft:item/generated',textures:[layer0:'halohaven:item/'+n]])
        }
        Map en=[cloudstone:'Cloudstone',skygrass:'Sky Meadow',pearl_bricks:'Pearl Bricks',
            sungold_tiles:'Sungold Tiles',azure_planks:'Azurewood Planks',aurora_glass:'Aurora Glass',
            starshade:'Starshade Lantern',dawn_glass:'Dawn Glass',moonstone:'Moonstone',
            celestial_mosaic:'Celestial Mosaic',gilded_pillar:'Gilded Pillar',cloud_lantern:'Cloud Lantern',
            waystone:'Aether Waystone',star_ore:'Star Ore',stardust:'Stardust',sunshard:'Sunshard',
            sky_compass:'Skybound Compass',aether_tonic:'Aether Tonic',
            ascension_sigil:'Ascension Sigil',skyberry:'Skyberries']
        Map ru=[cloudstone:'Облачный камень',skygrass:'Небесный луг',pearl_bricks:'Жемчужные кирпичи',
            sungold_tiles:'Солнечная черепица',azure_planks:'Лазурные доски',aurora_glass:'Авроральное стекло',
            starshade:'Звёздный светильник',dawn_glass:'Рассветное стекло',moonstone:'Лунный камень',
            celestial_mosaic:'Небесная мозаика',gilded_pillar:'Позолоченная колонна',cloud_lantern:'Облачный фонарь',
            waystone:'Эфирный путевой камень',star_ore:'Звёздная руда',stardust:'Звёздная пыль',
            sunshard:'Солнечный осколок',sky_compass:'Небесный компас',aether_tonic:'Эфирный эликсир',
            ascension_sigil:'Печать вознесения',skyberry:'Небесные ягоды']
        [en_us:en,ru_ru:ru].each { String lang,Map names ->
            Map lines=[:]
            names.each { String n,String label ->
                lines[(blocks.contains(n)?'block':'item')+'.halohaven.'+n]=label
            }
            if(lang=='ru_ru'){
                lines['message.halohaven.altar']='Колокол выше Y=170, кварц под ним и аметист по четырём углам платформы. Небо должно быть открыто.'
                lines['message.halohaven.welcome']='Вы достигли Небесной обители. Нажмите ПКМ с печатью в воздухе, чтобы вернуться.'
                lines['message.halohaven.compass_outside']='Небесный компас работает только в Небесной обители.'
                lines['message.halohaven.transit']='Переход в небесное поселение X: %s Z: %s.'
            }else{
                lines['message.halohaven.altar']='Bell above Y=170, quartz beneath, amethyst in all four platform corners, open sky required.'
                lines['message.halohaven.welcome']='Welcome to Halo Haven. Right-click the air holding the sigil to return.'
                lines['message.halohaven.compass_outside']='The Skybound Compass only works in Halo Haven.'
                lines['message.halohaven.transit']='Travelled to a sky settlement at X: %s Z: %s.'
            }
            writeJson('assets/halohaven/lang/'+lang+'.json',lines)
        }
        def recipe={ String n,List pat,Map keys,int count ->
            writeJson('data/halohaven/recipe/'+n+'.json',[
                type:'minecraft:crafting_shaped',category:'misc',pattern:pat,key:keys,
                result:[id:'halohaven:'+n,count:count]
            ])
        }
        recipe('ascension_sigil',['AFA','EGE','AFA'],[
            A:[item:'minecraft:amethyst_shard'],F:[item:'minecraft:feather'],
            E:[item:'minecraft:ender_pearl'],G:[item:'minecraft:ghast_tear']],1)
        recipe('pearl_bricks',['CC','CC'],[C:[item:'halohaven:cloudstone']],4)
        recipe('sungold_tiles',['GGG','GPG','GGG'],[
            G:[item:'minecraft:gold_nugget'],P:[item:'halohaven:pearl_bricks']],8)
        recipe('azure_planks',['CBC'],[
            C:[item:'halohaven:cloudstone'],B:[item:'minecraft:birch_planks']],4)
        recipe('aurora_glass',['GGG','GAG','GGG'],[
            G:[item:'minecraft:glass'],A:[item:'minecraft:amethyst_shard']],8)
        recipe('starshade',[' G ','GSG',' G '],[
            G:[item:'minecraft:glowstone_dust'],S:[item:'halohaven:aurora_glass']],4)
        // Explicit large-format, UV-friendly skins. Pixel-art is hand composed by zones.
        def skin={ String name,int width,int height,int background,int highlight,int dark,int gold,int glow ->
            BufferedImage im=new BufferedImage(width,height,BufferedImage.TYPE_INT_ARGB)
            for(int y=0;y<height;y++)for(int x=0;x<width;x++){
                int n=Math.floorMod((x*71)^(y*113)^(x*y*7),19)
                int c=n<3?highlight:n<6?dark:background
                im.setRGB(x,y,(int)(0xff000000L|c))
            }
            def rect={int x1,int y1,int x2,int y2,int c ->
                for(int py=Math.max(0,y1);py<=Math.min(height-1,y2);py++)
                for(int px=Math.max(0,x1);px<=Math.min(width-1,x2);px++)
                    im.setRGB(px,py,(int)(0xff000000L|c))
            }
            def stripe={int y,int x1,int x2,int c ->rect(x1,y,x2,y,c)}
            if(name=='skyfolk'){
                rect(0,0,31,15,0xffd2b89e)
                rect(8,8,15,15,0xffe9ccac)
                rect(9,10,10,11,0xff243f51);rect(13,10,14,11,0xff243f51)
                rect(11,13,12,13,0xffba8a7a)
                rect(7,7,16,8,0xfff4d18a)
                rect(1,0,6,7,0xfff1dba2);rect(24,0,31,7,0xffdfc080)
                rect(16,20,39,42,0xff678ea0)
                rect(19,22,35,26,0xffedf2e3)
                rect(18,27,37,28,0xffe3bc78)
                rect(22,32,32,40,0xff315771)
                rect(25,31,29,36,0xffe3bc78)
                rect(26,33,28,35,0xfffff3c6)
                rect(40,38,63,55,0xff678ea0)
                rect(44,42,46,52,0xffdfb76e)
                rect(55,42,57,52,0xffdfb76e)
                rect(20,45,35,63,0xff315c75)
                rect(20,47,35,48,0xffdbb874)
            }else if(name=='dawn_guardian'){
                rect(0,0,127,31,0xffede0c7)
                rect(0,32,127,68,0xffd6d7cf)
                rect(0,70,127,127,0xffc8c9bc)
                for(int k=0;k<5;k++) {
                    int xx=9+k*21
                    rect(xx,32,xx+2,98,0xffa68756)
                    rect(xx+3,32,xx+3,98,0xfff9e2a8)
                }
                rect(32,48,95,80,0xfff2e8d2)
                rect(40,56,88,59,0xffbb985c)
                rect(57,60,70,75,0xffdebb6a)
                rect(61,63,66,70,0xffc8fcfa)
                rect(62,65,65,68,0xffffffff)
                rect(8,16,23,19,0xff6baab3)
                rect(40,16,55,19,0xff6baab3)
            }else if(name=='cloudhare'){
                rect(0,0,63,63,0xfff0e1e8)
                rect(0,0,31,15,0xfff8edf3)
                rect(10,9,13,11,0xff344958);rect(18,9,21,11,0xff344958)
                rect(11,13,19,14,0xfff8bdcb)
                rect(0,32,63,40,0xffd4bad8)
                rect(36,3,37,15,0xffe49dcb);rect(42,3,43,15,0xffe49dcb)
            }else if(name=='lumen'){
                rect(0,0,63,63,0xffb6e8d8)
                rect(0,0,31,15,0xffddfff4)
                rect(10,9,12,11,0xff517e9b);rect(19,9,21,11,0xff517e9b)
                rect(16,12,17,12,0xfffbe3ab)
                rect(16,24,36,32,0xff91cae1)
                rect(19,25,32,26,0xffe8fff7)
                rect(22,27,29,28,0xffffe2a7)
                rect(48,20,62,35,0xfff4e1a4)
            }else if(name=='dusk_wraith'){
                rect(0,0,63,63,0xff343657)
                rect(0,0,31,15,0xff393e64)
                rect(9,9,13,11,0xff6be8ed);rect(19,9,23,11,0xff6be8ed)
                rect(10,10,12,10,0xffffffff);rect(20,10,22,10,0xffffffff)
                rect(15,12,17,13,0xff4b90a5)
                rect(16,20,47,40,0xff262a45)
                rect(20,23,43,24,0xffa38bce)
                rect(26,27,37,34,0xff2d5670)
                rect(29,28,33,32,0xff9cf2f3)
            }
            writePng('assets/halohaven/textures/entity/'+name+'.png',im)
        }
        skin('skyfolk',64,64,0xff86a4ab,0xffaac4c9,0xff66818b,0xffe8c67e,0xffe8f7ea)
        skin('cloudhare',64,64,0xffeedee7,0xfffaf2f3,0xffcbb6cf,0xffe6b7d2,0xffffffff)
        skin('lumen',64,64,0xffa5ded6,0xffd9f9e9,0xff72acb1,0xfff9e5a2,0xffe5ffff)
        skin('dawn_guardian',128,128,0xffe2ddd0,0xfff7efdd,0xffacaea8,0xffd7b46c,0xffe9fcfc)
        skin('dusk_wraith',64,64,0xff353958,0xff47446f,0xff22283d,0xffa28cb5,0xff6cfafa)
        // Items are separate 32px silhouettes, with transparent backgrounds.
        def icon={String name,int color,int outline,int center ->
            BufferedImage img=new BufferedImage(32,32,BufferedImage.TYPE_INT_ARGB)
            for(int y=0;y<32;y++)for(int x=0;x<32;x++){
                int dx=Math.abs(x-15),dy=Math.abs(y-15),c=0
                if(name=='stardust' || name=='sunshard'){
                    if((dx<=2&&dy<=12)||(dy<=2&&dx<=12)||(dx==dy&&dx<=7))c=outline
                    if(dx+dy<11)c=color
                    if(dx+dy<5)c=center
                    if(name=='stardust'&&((x==4&&y==26)||(x==25&&y==6)))c=center
                }else if(name=='sky_compass'){
                    if(dx*dx+dy*dy<190)c=outline
                    if(dx*dx+dy*dy<150)c=color
                    if(dx+dy<11)c=center
                    if(dx<=1&&dy<=7)c=outline
                    if(dy<=1&&dx<=7)c=outline
                }else if(name=='aether_tonic'){
                    if(x>=10&&x<=21&&y>=12&&y<=29)c=outline
                    if(x>=12&&x<=19&&y>=15&&y<=27)c=color
                    if(x>=13&&x<=18&&y>=21&&y<=27)c=center
                    if(x>=13&&x<=18&&y>=7&&y<=13)c=outline
                    if(x>=12&&x<=19&&y==8)c=0xfff9df9b
                }
                img.setRGB(x,y,c)
            }
            writePng('assets/halohaven/textures/item/'+name+'.png',img)
            writeJson('assets/halohaven/models/item/'+name+'.json',[
                parent:'minecraft:item/generated',textures:[layer0:'halohaven:item/'+name]])
        }
        icon('stardust',0xff79b5d0,0xff315d86,0xffffffff)
        icon('sunshard',0xffe8b95b,0xff9f7641,0xffffffd5)
        icon('sky_compass',0xffe4c789,0xff637e98,0xffe0faf1)
        icon('aether_tonic',0xff99dfd8,0xff789bb4,0xffecfff4)
        Map eggs=[skyfolk:0xff739dac,cloudhare:0xffeadce2,lumen:0xffb8eee0,
            dawn_guardian:0xffd8c38a,dusk_wraith:0xff4c476b]
        eggs.each { String n,int col ->
            // Vanilla's spawn egg item template handles egg tinting.
            writeJson('assets/halohaven/models/item/'+n+'_spawn_egg.json',
                [parent:'minecraft:item/template_spawn_egg'])
        }
        def rareDrop={String table,String type,String item,int min,int max ->
            Map count=[function:'minecraft:set_count',
                count:[type:'minecraft:uniform',min:min,max:max]]
            Map entry=[type:'minecraft:item',name:'halohaven:'+item,functions:[count]]
            Map pool=[rolls:1,entries:[entry]]
            writeJson('data/halohaven/loot_table/'+table+'.json',[
                type:type,pools:[pool]
            ])
        }
        rareDrop('blocks/star_ore','minecraft:block','stardust',2,4)
        rareDrop('entities/cloudhare','minecraft:entity','skyberry',1,3)
        rareDrop('entities/dusk_wraith','minecraft:entity','stardust',2,5)
        recipe('dawn_glass',['GGG','GSG','GGG'],[
            G:[item:'minecraft:glass'],S:[item:'halohaven:sunshard']],8)
        recipe('celestial_mosaic',['PP','PP'],[P:[item:'halohaven:pearl_bricks']],4)
        recipe('gilded_pillar',[' G ',' P ',' G '],[
            G:[item:'minecraft:gold_ingot'],P:[item:'halohaven:pearl_bricks']],3)
        recipe('cloud_lantern',[' G ','SAS',' G '],[
            G:[item:'minecraft:glowstone_dust'],S:[item:'halohaven:skyberry'],A:[item:'halohaven:aurora_glass']],2)
        recipe('sky_compass',[' S ','SCS',' S '],[
            S:[item:'halohaven:stardust'],C:[item:'minecraft:compass']],1)
        recipe('aether_tonic',[' S ',' B ',' G '],[
            S:[item:'halohaven:stardust'],B:[item:'halohaven:skyberry'],G:[item:'minecraft:glass_bottle']],2)
        recipe('sunshard',[' S ','SGS',' S '],[
            S:[item:'halohaven:stardust'],G:[item:'minecraft:gold_ingot']],2)
        // Villager and mob localization (independent of vanilla texture paths)
        ['en_us','ru_ru'].each { lang ->
            File f=new File(base,'assets/halohaven/lang/'+lang+'.json')
            Map data=new groovy.json.JsonSlurper().parse(f)
            Map entries=lang=='ru_ru'?[
                skyfolk:'Небесный житель',cloudhare:'Облачный заяц',lumen:'Люмен',
                dawn_guardian:'Рассветный страж',dusk_wraith:'Сумеречный призрак'
            ]:[
                skyfolk:'Skyfolk',cloudhare:'Cloud Hare',lumen:'Lumen',
                dawn_guardian:'Dawn Guardian',dusk_wraith:'Dusk Wraith'
            ]
            entries.each { String n,String v ->
                data['entity.halohaven.'+n]=v
                data['item.halohaven.'+n+'_spawn_egg']=(lang=='ru_ru'?'Яйцо призыва: ':'Spawn ')+v
            }
            writeJson('assets/halohaven/lang/'+lang+'.json',data)
        }
        writeJson('data/minecraft/tags/block/mineable/pickaxe.json',[
            replace:false,values:['halohaven:cloudstone','halohaven:pearl_bricks',
                'halohaven:sungold_tiles','halohaven:aurora_glass','halohaven:starshade',
                'halohaven:dawn_glass','halohaven:moonstone','halohaven:celestial_mosaic',
                'halohaven:gilded_pillar','halohaven:cloud_lantern','halohaven:waystone','halohaven:star_ore']])
        writeJson('data/minecraft/tags/block/mineable/axe.json',[replace:false,values:['halohaven:azure_planks']])
        writeJson('data/minecraft/tags/block/dirt.json',[replace:false,values:['halohaven:skygrass']])
        writeJson('data/minecraft/tags/block/animals_spawnable_on.json',[replace:false,values:['halohaven:skygrass']])
    }
}
sourceSets.main.resources.srcDir generatedHaloAssets
tasks.named('processResources').configure { dependsOn 'generateHaloAssets' }
