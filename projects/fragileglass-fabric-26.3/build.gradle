plugins { id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT' }
group='dev.minemods.fragileglass'
version='1.0.2'
base.archivesName='fragileglass-fabric-mc26.3'
java.toolchain.languageVersion=JavaLanguageVersion.of(25)
dependencies {
 minecraft 'com.mojang:minecraft:26.3'
 implementation 'net.fabricmc:fabric-loader:0.19.5'
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=25 }

// Shared byte-identical sources; every target still compiles independently.
sourceSets.main.java.srcDir('../../shared/fragileglass/fabric/src/main/java')
sourceSets.main.resources.srcDirs('../../shared/fragileglass/fabric/src/main/resources', '../../shared/fragileglass/common/src/main/resources')
