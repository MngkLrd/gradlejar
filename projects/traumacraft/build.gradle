plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = mod_group_id
version = mod_version
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { url = 'https://maven.blamejared.com/' }
    mavenCentral()
}
dependencies {
    // Optional JEI integration. JEI is NOT needed to run the mod.
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
tasks.named('processResources', ProcessResources).configure {
    def props = [mod_id: mod_id, mod_version: mod_version, minecraft_version: minecraft_version, neo_version: neo_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
