plugins {
 id 'java-library'
 id 'idea'
 id 'net.neoforged.moddev.legacyforge' version '2.0.147'
}
group='com.kirill.lurelantern'
version='1.3.10'
base.archivesName='lurelantern-forge-mc1.20.1'
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
legacyForge {
 enable {
  forgeVersion = project.minecraft_version+'-'+project.loader_version
  disableRecompilation=true
 }
 runs { client { client() }; server { server() } }
 mods { lurelantern { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach {options.encoding='UTF-8';options.release=17}
