plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.minemods'
version = '0.1.1'
base.archivesName = 'everybodyiswatching-neoforge-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.197'
    runs {
        client { client() }
        server { server() }
    }
    mods { everybodyiswatching { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
