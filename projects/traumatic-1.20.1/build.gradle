plugins { id 'java-library'; id 'idea'; id 'net.neoforged.moddev.legacyforge' version '2.0.147' }
group = mod_group_id
version = mod_version
base.archivesName = "${mod_id}-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
legacyForge {
    enable { forgeVersion = project.minecraft_version + '-' + project.forge_version; disableRecompilation = true }
    runs { client { client() }; server { server() } }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
repositories { maven { url = 'https://maven.blamejared.com/' } }
dependencies { compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}" }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=17 }
