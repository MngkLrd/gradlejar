plugins { id 'java-library'; id 'net.neoforged.moddev.legacyforge' version '2.0.147' }
group = 'dev.minemods.keepmycargo'
version = '1.0.0'
base.archivesName = 'keepmycargo-forge-mc1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
legacyForge {
    enable { forgeVersion = '1.20.1-47.3.0'; disableRecompilation = true }
    runs { client { client() } }
    mods { keepmycargo { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }

sourceSets.main.java.srcDir '../keepmycargo-ports-common/legacy'
dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
mixin { add sourceSets.main, 'keepmycargo.refmap.json'; config 'keepmycargo.mixins.json' }
jar { manifest.attributes(['MixinConfigs':'keepmycargo.mixins.json']) }
