plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
}
group = mod_group_id
version = mod_version
base.archivesName = 'primitivewaterworks'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
legacyForge {
    enable {
        forgeVersion = project.minecraft_version + '-' + project.forge_version
        disableRecompilation = true
    }
    runs {
        client { client() }
        server { server() }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

repositories { maven { url = "https://maven.architectury.dev" } }
dependencies {
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-forge:12.1.785"
    compileOnly "me.shedaniel:RoughlyEnoughItems-forge:12.1.785"
}
