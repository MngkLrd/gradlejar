plugins { id 'java-library'; id 'net.neoforged.moddev.legacyforge' version '2.0.147' }
group = 'dev.minemods.campfirebatch'
version = '1.0.1'
base.archivesName = 'campfirebatch-neoforge-mc1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
legacyForge {
    enable { neoForgeVersion = '1.20.1-47.1.106'; disableRecompilation = true }
    runs { client { client() } }
    mods { campfirebatch { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
