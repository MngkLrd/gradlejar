plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'com.kirill.harvestglow'
version = '1.1.0'
base.archivesName = 'harvestglow-neoforge-mc26.3'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge {
    version = '26.3.0.101'
    runs { client { client() } }
    mods { harvestglow { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
