plugins { id 'fabric-loom' version '1.11.8' }
group = 'dev.minemods.fooddigestion'
version = '1.0.0'
base.archivesName = 'fooddigestion-fabric-mc1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.17.3'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.register('digestionSelfTest', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'dev.minemods.fooddigestion.DigestionTest' }
tasks.named('check') { dependsOn 'digestionSelfTest' }
