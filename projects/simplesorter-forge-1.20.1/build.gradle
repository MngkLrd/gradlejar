plugins { id 'java-library'; id 'idea'; id 'net.neoforged.moddev.legacyforge' version '2.0.147' }
group=mod_group_id
version=mod_version
base.archivesName='simplesorter'
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
legacyForge {
 enable { forgeVersion=project.minecraft_version+'-'+project.forge_version; disableRecompilation=true }
 runs { client { client() }; server { server() } }
 mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8';options.release=17 }

// The live inventory regression is compiled only for the disposable CI server.
if (System.getenv('SIMPLE_SORTER_CI_STORAGE_TEST') == '1') {
    sourceSets.main.java.srcDir 'src/ci/java'
}
