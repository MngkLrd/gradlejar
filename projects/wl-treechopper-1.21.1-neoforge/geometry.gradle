import groovy.json.JsonOutput
def custom=['willow','larch','pine','fir','cedar','maple','beech','alder','palm','date_palm','baobab','ebony','mahogany']
def species=['oak','spruce','birch','jungle','acacia','dark_oak','mangrove','cherry']+custom
def generated=layout.buildDirectory.dir('generated/treechopperResources')
sourceSets.main.resources.srcDir(generated)
tasks.register('generateTreeGeometry') {
    outputs.dir(generated)
    inputs.file('geometry.gradle')
    doLast {
        def root=generated.get().asFile
        // Drop obsolete generated multipart assets on incremental builds.
        project.delete(root)
        def emit={String path,Object data -> def f=new File(root,path); f.parentFile.mkdirs(); f.text=JsonOutput.toJson(data) }
        def asset='assets/wl_treechopper/'
        def en=['message.wl_treechopper.axe_worn':'Not enough axe durability to fell the tree (need %s).']; def ru=['message.wl_treechopper.axe_worn':'Недостаточно прочности топора для валки дерева (нужно %s).']
        en.putAll(['message.wl_treechopper.landing_blocked':'Tree fall is obstructed. Clear the path or strike from another side.','message.wl_treechopper.find_notch':'Strike the visible notch.','message.wl_treechopper.notch_order':'Process the preceding notch first.']); ru.putAll(['message.wl_treechopper.landing_blocked':'Путь падения перекрыт. Освободи его или ударь с другой стороны.','message.wl_treechopper.find_notch':'Ударь по зазубрине на стволе.','message.wl_treechopper.notch_order':'Сначала обработай предыдущую зазубрину.']);
        en['message.wl_treechopper.supports']='Cut supports: %s/%s'; ru['message.wl_treechopper.supports']='Прорублено опор: %s/%s'
        en['message.wl_treechopper.directed_cut']='Directional notch and back cut'; ru['message.wl_treechopper.directed_cut']='Направляющий сруб и обратный пропил'
        species.each { s ->
            def namespace=custom.contains(s)?'worldlogicterrain':'minecraft'
            def bark="${namespace}:block/${s}_log"
            def end="${namespace}:block/${s}_log_top"
            def wood=custom.contains(s)?end:"minecraft:block/stripped_${s}_log"
            def model={String name,int x0,int y0,int z0,int x1,int y1,int z1 ->
                def faces=[
                    north:[uv:[16-x1,16-y1,16-x0,16-y0],texture:z0==0?'#bark':'#wood'],
                    south:[uv:[x0,16-y1,x1,16-y0],texture:z1==16?'#bark':'#wood'],
                    west:[uv:[z0,16-y1,z1,16-y0],texture:x0==0?'#bark':'#wood'],
                    east:[uv:[16-z1,16-y1,16-z0,16-y0],texture:x1==16?'#bark':'#wood'],
                    up:[uv:[x0,z0,x1,z1],texture:'#end'],
                    down:[uv:[x0,16-z1,x1,16-z0],texture:'#end']
                ]
                emit(asset+"models/block/${name}.json",[textures:[particle:bark,bark:bark,wood:wood,end:end],elements:[[from:[x0,y0,z0],to:[x1,y1,z1],faces:faces]]])
                return [model:"wl_treechopper:block/${name}"]
            }
            // Original low-poly forked branch geometry. Sample actual species bark/end at native 16px scale.
            def twig="twig_${s}"
            def twigModels=[]
            def shapes = [
                [[7,0,1,9,2,10,0],[7,0,9,8,1,15,-22.5],[8,0,5,10,1,11,45],[8,0,9,9,1,13,45]],
                [[7,0,2,9,2,13,0],[6,0,1,8,1,6,-22.5],[8,0,6,10,2,13,-45],[7,0,9,8,1,15,22.5]],
                [[7,0,1,9,2,12,0],[7,0,10,8,1,15,22.5],[5,0,4,7,1,10,-45],[8,0,8,9,1,14,45]]
            ]
            shapes.eachWithIndex { segments, variant ->
                def elements=segments.collect { a ->
                    def faces=[:]
                    ['north','south','west','east','up','down'].each { face ->
                        def length=a[5]-a[2];def width=a[3]-a[0];def height=a[4]-a[1]
                        def uv = (face in ['north','south']) ? [0,0,width,height] : ((face in ['up','down']) ? [2,1,2+width,1+length] : [3,1,3+height,1+length])
                        faces[face]=[uv:uv,texture:((face in ['north','south']) ? '#end' : '#bark')]
                    }
                    def e=[from:a[0..2],to:a[3..5],faces:faces]
                    if(a[6]!=0)e.rotation=[origin:[(a[0]+a[3])/2,0,a[2]],axis:'y',angle:a[6],rescale:false]
                    e
                }
                def name=twig+"_"+variant
                emit(asset+"models/block/${name}.json",[textures:[particle:bark,bark:bark,end:end],elements:elements])
                twigModels << [model:"wl_treechopper:block/${name}"]
            }
            def variants=[:]
            ['north':0,'east':90,'south':180,'west':270].each { d,r -> variants["facing="+d]=twigModels.collect { it+[y:r] } }
            emit(asset+"blockstates/${twig}.json",[variants:variants])
            emit("data/wl_treechopper/loot_table/blocks/${twig}.json",[type:'minecraft:block',pools:[[rolls:1,entries:[[type:'minecraft:item',name:'minecraft:stick']],conditions:[[condition:'minecraft:survives_explosion']]]]])
            en["block.wl_treechopper.${twig}"]="Fallen ${s} twig"
            ru["block.wl_treechopper.${twig}"]="Опавшая веточка (${s})"
            def cut="cut_${s}"; def stump="stump_${s}"
            def bottom=model(stump,0,0,0,16,4,16)
            def top=model(cut+'_top',0,12,0,16,16,16)
            def upper="fallen_upper_${s}"
            def upperModel=model(upper,0,0,0,16,12,16)
            emit(asset+"blockstates/${upper}.json",[variants:['':upperModel]])
            def fallen="fallen_${s}"
            def full=model(fallen+'_full',0,0,0,16,16,16)
            def markerParts=[model(fallen+'_a',0,0,0,16,6,16),model(fallen+'_b',2,6,2,14,10,14),model(fallen+'_c',0,10,0,16,16,16)]
            def fallenMulti=[]
            ['y','z','x'].each { axis ->
                def rotation=axis=='y' ? [:] : (axis=='z' ? [x:90] : [x:90,y:90])
                fallenMulti << [when:[axis:axis,marker:'false'],apply:full+rotation]
                markerParts.each { part -> fallenMulti << [when:[axis:axis,marker:'true'],apply:part+rotation] }
            }
            emit(asset+"blockstates/${fallen}.json",[multipart:fallenMulti])
            en["block.wl_treechopper.${fallen}"]="Fallen ${s} timber"
            ru["block.wl_treechopper.${fallen}"]="Поваленный ствол (${s})"
            emit(asset+"models/block/${cut}.json",[loader:'wl_treechopper:dynamic_cut',textures:[particle:bark,bark:bark,wood:wood,end:end]])
            emit(asset+"blockstates/${cut}.json",[variants:['':[model:"wl_treechopper:block/${cut}"]]])
            emit(asset+"blockstates/${stump}.json",[variants:['':bottom]])
            [cut,stump,fallen].each { id ->
                def loot=[type:'minecraft:block',pools:[[rolls:1,entries:[[type:'minecraft:item',name:"${namespace}:${s}_log"]],conditions:[[condition:'minecraft:survives_explosion']]]]]
                if(custom.contains(s))loot['neoforge:conditions']=[[type:'neoforge:mod_loaded',modid:'worldlogicterrain']]
                emit("data/wl_treechopper/loot_table/blocks/${id}.json",loot)
            }
            en["block.wl_treechopper.${cut}"]="Notched ${s} log"
            en["block.wl_treechopper.${stump}"]=" ${s.capitalize()} stump".trim()
            ru["block.wl_treechopper.${cut}"]="Подрубленный ствол (${s})"
            ru["block.wl_treechopper.${stump}"]="Пень (${s})"
        }
        // Raw stone fragments: independent low-poly shapes, using the parent's native texture.
        def rawRockNames=[
            stone:['Stone','Камень'], granite:['Granite','Гранит'], diorite:['Diorite','Диорит'], andesite:['Andesite','Андезит'],
            deepslate:['Deepslate','Глубинный сланец'], tuff:['Tuff','Туф'], calcite:['Calcite','Кальцит'], basalt:['Basalt','Базальт'],
            smooth_basalt:['Smooth basalt','Гладкий базальт'], blackstone:['Blackstone','Чернит'], sandstone:['Sandstone','Песчаник'],
            red_sandstone:['Red sandstone','Красный песчаник'], dripstone_block:['Dripstone','Карстовый камень'],
            limestone:['Limestone','Известняк'], shale:['Shale','Глинистый сланец'], slate:['Slate','Сланец'], gneiss:['Gneiss','Гнейс'], volcanic_tuff:['Volcanic tuff','Вулканический туф'],
            gravel:['Flint','Кремень']
        ]
        def coreRocks=['limestone','shale','slate','gneiss','volcanic_tuff']
        rawRockNames.each { name, names ->
            boolean flint=name=='gravel'
            def id=flint?'loose_flint':"pebble_${name}"
            def namespace=coreRocks.contains(name)?'worldlogic':'minecraft'
            def texture = flint ? 'minecraft:block/blackstone' : "${namespace}:block/${name == 'basalt' ? 'basalt_side' : name}"
            // Broad irregular rounded chips vs thin angular conchoidal flint shards.
            def forms = flint ? [
                [[5,0,5,11,1,10,0],[6,1,6,10,2,9,22.5],[7,2,7,9,3,8,0]],
                [[5,0,6,11,1,10,-22.5],[7,1,6,11,2,9,0],[8,2,7,10,3,8,0]]
            ] : [
                [[5,0,5,11,2,10,0],[6,2,6,10,3,9,0],[4,0,6,5,1,9,0]],
                [[5,0,6,11,2,11,0],[6,2,7,10,3,10,0],[7,0,4,10,1,6,0]],
                [[5,0,5,10,2,11,0],[6,2,6,9,3,10,0],[10,0,7,12,1,10,0]]
            ]
            def variants=[]
            forms.eachWithIndex { form,i ->
                def elements=form.collect { p ->
                    def x0=p[0],y0=p[1],z0=p[2],x1=p[3],y1=p[4],z1=p[5]
                    def faces=[
                        north:[uv:[x0,16-y1,x1,16-y0],texture:'#rock'],
                        south:[uv:[x0,16-y1,x1,16-y0],texture:'#rock'],
                        west:[uv:[z0,16-y1,z1,16-y0],texture:'#rock'],
                        east:[uv:[z0,16-y1,z1,16-y0],texture:'#rock'],
                        up:[uv:[x0,z0,x1,z1],texture:'#rock'],
                        down:[uv:[x0,z0,x1,z1],texture:'#rock']
                    ]
                    def e=[from:p[0..2],to:p[3..5],faces:faces]
                    if(p[6]!=0)e.rotation=[origin:[8,0,8],axis:'y',angle:p[6],rescale:false]
                    e
                }
                def model="wl_treechopper:block/${id}_${i}"
                emit(asset+"models/block/${id}_${i}.json",[textures:[particle:texture,rock:texture],elements:elements])
                [0,90,180,270].each { r -> variants << [model:model,y:r] }
            }
            emit(asset+"blockstates/${id}.json",[variants:['':variants]])
            if(!flint)emit(asset+"models/item/${id}.json",[parent:"wl_treechopper:block/${id}_0",display:[gui:[rotation:[30,225,0],translation:[0,4,0],scale:[1.5,1.5,1.5]],ground:[translation:[0,2,0],scale:[1,1,1]],firstperson_righthand:[rotation:[0,45,0],translation:[0,3,0],scale:[1,1,1]]]])
            emit("data/wl_treechopper/loot_table/blocks/${id}.json",[type:'minecraft:block',pools:[[rolls:1,entries:[[type:'minecraft:item',name:(flint ? 'minecraft:flint' : "wl_treechopper:${id}")]],conditions:[[condition:'minecraft:survives_explosion']]]]])
            en["block.wl_treechopper.${id}"]=flint?'Loose flint':"${names[0]} pebble"
            ru["block.wl_treechopper.${id}"]=flint?'Лежащий кремень':"Камушек (${names[1]})"
        }
        emit(asset+'lang/en_us.json',en);emit(asset+'lang/ru_ru.json',ru)
        emit('data/minecraft/tags/block/mineable/axe.json',[replace:false,values:species.collectMany{["wl_treechopper:cut_${it}","wl_treechopper:stump_${it}","wl_treechopper:fallen_${it}"]}])
    }
}
tasks.named('processResources') { dependsOn('generateTreeGeometry') }
