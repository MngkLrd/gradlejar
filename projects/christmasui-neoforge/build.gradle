plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
group='dev.christmasui'
version='0.3.5'
base.archivesName='christmasui-neoforge-1.21.1'
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
neoForge { version='21.1.228'; runs { client { client() } }; mods { christmasui { sourceSet(sourceSets.main) } } }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }
def artDir = layout.buildDirectory.dir('generated/christmasui')
tasks.register('generateChristmasArt', Exec) {
    inputs.files('tools/art.py', 'tools/winter.py')
    outputs.dir(artDir)
    commandLine 'python3', 'tools/art.py', '--download', artDir.get().asFile.absolutePath
}
sourceSets.main.resources.srcDir(artDir)
tasks.named('processResources') { dependsOn('generateChristmasArt') }
tasks.register('resourcePack', Zip) {
    dependsOn('generateChristmasArt')
    from(artDir)
    from('src/main/resources') { include 'pack.mcmeta' }
    archiveFileName='christmasui-resourcepack-1.21.1-0.3.5.zip'
    destinationDirectory=layout.buildDirectory.dir('packs')
}
